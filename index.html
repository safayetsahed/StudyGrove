/* ============================== EVENTS ============================== */
const anyModal=()=>[el.confirm,el.calModal,el.todoModal,el.settings,el.repModal].some(isOpen);
function spaceOK(e){
  const t=e.target,tag=t&&t.tagName;
  return!(['INPUT','TEXTAREA','SELECT'].includes(tag)||(t&&t.isContentEditable))&&!anyModal();
}
function bindEvents(){
  // dashboard
  el.btnStart.addEventListener('click',toggleTimer);
  el.btnSave.addEventListener('click',saveSession);
  el.btnReset.addEventListener('click',requestReset);
  el.modeTabs.addEventListener('click',e=>{const b=e.target.closest('button[data-sel]');if(b)selectMode(b.dataset.sel);});
  el.subjBtn.addEventListener('click',()=>{if(el.subjPanel.classList.contains('open'))closeSubj();else openSubj();});
  el.subjPanel.addEventListener('click',e=>{const c=e.target.closest('.sc-card');if(c)setSubject(c.dataset.s);});
  el.customStep.addEventListener('click',e=>{const b=e.target.closest('[data-cd]');if(b&&T.status==='idle')setCustom(state.customMin+(+b.dataset.cd));});
  el.customMin.addEventListener('change',()=>{if(T.status==='idle')setCustom(el.customMin.value);else el.customMin.value=state.customMin;});
  el.dashToggle.addEventListener('click',()=>setDashMin(!el.dash.classList.contains('min')));
  el.dash.addEventListener('click',e=>{
    if(e.target.closest('#dashToggle'))return;
    if(el.dash.classList.contains('min'))setDashMin(false);
    else if(e.target.closest('.brand'))setDashMin(true);
  });

  // top-right: sky · ambient · fullscreen · settings
  el.btnSky.addEventListener('click',()=>togglePop('sky'));
  el.btnAmb.addEventListener('click',()=>togglePop('amb'));
  el.btnFull.addEventListener('click',toggleFull);
  el.btnSettings.addEventListener('click',openSettings);
  el.skyPop.addEventListener('click',e=>{const b=e.target.closest('[data-sky]');if(b)setSky(b.dataset.sky);});
  el.ambPop.addEventListener('click',e=>{
    if(e.target.closest('#ambStop')){ambStopAll();return;}
    if(e.target.closest('#ambMute')){ensureAudio();setMute(!state.amb.mute);return;}
    if(e.target.closest('#plAdd')){$('#plFile').click();return;}
    if(e.target.closest('#sndLoad')){$('#sndFile').click();return;}
    const pb=e.target.closest('[data-pl]');
    if(pb){
      const act=pb.dataset.pl,row=pb.closest('.pl-row');
      if(act==='row'&&row){const i=+row.dataset.i;if(i===PL.cur&&PL.el&&!PL.el.paused)plPause();else plPlay(i);}
      else if(act==='del'&&row)plRemove(row.dataset.id);
      else if(act==='toggle')plToggle();else if(act==='next'){if(PL.cur<0)plPlay(0);else plNext(false);}else if(act==='prev')plPrev();
      return;
    }
    if(e.target.closest('input'))return;
    const r=e.target.closest('.snd');if(r)ambToggle(r.dataset.id);
  });
  el.ambPop.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='ambVol'){ensureAudio();setVol(t.value/100);}
    else if(t.dataset.vol){setSoundVol(t.dataset.vol,t.value/100);}
    else if(t.id==='plSeek'&&PL.el&&isFinite(PL.el.duration))PL.el.currentTime=PL.el.duration*t.value/1000;
  });
  el.ambPop.addEventListener('change',e=>{if(e.target.id==='sndFile'){const f=[...e.target.files];e.target.value='';if(f.length)importSounds(f);return;}if(e.target.id==='plFile'){const f=[...e.target.files];e.target.value='';if(f.length)plAdd(f);}});
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.wrap'))closePops();if(!e.target.closest('#subjPanel,#subjBtn'))closeSubj();});     // click outside closes the popups
  ['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,renderFull));
  const refreshFull=()=>{curPos.full=isFull();if(!curPos.full)curPos.near=false;applyCursor();};
  ['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,()=>{refreshFull();setTimeout(refreshFull,250);}));
  window.addEventListener('resize',()=>{if(state.cursor!=='default')refreshFull();});
  const onPtr=e=>{
    curPos.x=e.clientX;curPos.y=e.clientY;
    // the browser drops custom cursors near the screen edges in fullscreen, so only there the page draws the cursor itself
    const E=34,near=curPos.full&&(curPos.x<E||curPos.y<E||curPos.x>innerWidth-E||curPos.y>innerHeight-E);
    if(near!==curPos.near){curPos.near=near;if(state.cursor!=='default')applyCursor();}
    if(curPos.layer){curPos.layer.classList.toggle('off',e.pointerType==='touch');if(curPos.near)placeCur();}
  };
  window.addEventListener('pointermove',onPtr,{capture:true,passive:true});
  if('onpointerrawupdate' in window)window.addEventListener('pointerrawupdate',onPtr,{capture:true,passive:true});
  document.documentElement.addEventListener('pointerleave',()=>{if(curPos.layer)curPos.layer.classList.add('off');});
  document.documentElement.addEventListener('pointerenter',()=>{if(curPos.layer)curPos.layer.classList.remove('off');});

  // bottom-left: calendar · to-do
  el.btnCal.addEventListener('click',openCal);
  el.btnTodo.addEventListener('click',openTodo);
  el.bkBGo.addEventListener('click',()=>{if(bk.mode==='reconnect')bkReconnect();else bkChoose();});
  el.bkBLater.addEventListener('click',()=>{if(bk.mode==='reconnect')bkSet('sg.bkNot',sessionStorage);else{try{localStorage.setItem('studygrove.bkLater',String(Date.now()));}catch(e){}}bkBanner('');});
  el.bkBOff.addEventListener('click',()=>{bkSet('studygrove.bkOff');bkBanner('');toast('Okay, no more backup reminders. Your data is still saved in this browser.');});
  el.btnRep.addEventListener('click',openRep);el.repClose.addEventListener('click',closeRep);
  el.repModal.addEventListener('click',e=>{
    const t=e.target.closest('[data-rtab],[data-rw],[data-scope]');if(!t||t.disabled)return;
    if(t.dataset.rtab)rep.tab=t.dataset.rtab;
    else if(t.dataset.scope)rep.scope=t.dataset.scope;
    else if(t.dataset.rw!==undefined){const v=+t.dataset.rw;rep.off=v===0?0:Math.min(0,rep.off+v);}
    renderReport(true);
  });

  // modals
  el.setClose.addEventListener('click',closeSettings);
  el.calClose.addEventListener('click',closeCal);
  el.todoClose.addEventListener('click',closeTodo);
  [['settings',closeSettings],['repModal',closeRep],['calModal',closeCal],['todoModal',closeTodo],['confirm',closeConfirm]].forEach(([id,fn])=>el[id].addEventListener('mousedown',e=>{if(e.target===el[id])fn();}));
  el.cfBtns.addEventListener('click',e=>{
    const b=e.target.closest('[data-i]');if(!b)return;
    const a=cfActs[+b.dataset.i];closeConfirm();if(a&&a.fn)a.fn();
  });
  el.setBody.addEventListener('click',e=>{
    const co=e.target.closest('.cur-opt');if(co){setCursor(co.dataset.curid);return;}
    if(e.target.closest('#curFold')){toggleCurFold();return;}
    if(e.target.closest('#wipeAll')){confirmWipe();return;}
    const b=e.target.closest('[data-d]');
    if(b){const st=b.closest('.stepper'),k=st.dataset.key;setNum(k,getNum(k)+(+b.dataset.d));syncSettings();}
  });
  el.setBody.addEventListener('change',e=>{if(e.target.id==='setReset'){setResetTime(e.target.value);return;}if(e.target.matches('.stepper input')){setNum(e.target.closest('.stepper').dataset.key,e.target.value);syncSettings();}});

  // calendar
  el.calPrev.addEventListener('click',()=>calMove(-1));
  el.calNext.addEventListener('click',()=>calMove(1));
  el.calToday.addEventListener('click',()=>{const d=new Date();ui.y=d.getFullYear();ui.m=d.getMonth();flushNote();ui.sel=studyDay();renderCal();});
  el.calGrid.addEventListener('click',e=>{const b=e.target.closest('.dc');if(b)selectDay(b.dataset.k);});
  el.calDay.addEventListener('input',e=>{if(e.target.id==='calNote')noteInput(e.target.value);});
  el.calDay.addEventListener('click',e=>{
    if(e.target.closest('#calTaskAdd')){const i=$('#calTaskIn');if(addTodo(i.value,ui.sel)){i.value='';i.focus();}return;}
    const sd=e.target.closest('[data-sdel]');if(sd){confirmDeleteSession(sd.dataset.sdel);return;}
    const b=e.target.closest('[data-act]');if(b)todoAct(b.dataset.act,b.dataset.id,b);
  });

  // to-do
  el.todoBody.addEventListener('click',e=>{
    const t=e.target.closest('[data-tab]');if(t){ui.tab=t.dataset.tab;ui.editing=null;renderTodo();return;}
    const dd=e.target.closest('[data-day]');if(dd){shiftDay(+dd.dataset.day);return;}
    if(e.target.closest('#tdAdd')){
      const i=$('#tdIn'),date=$('#tdAddDate').value;
      if(addTodo(i.value,date)){i.value='';i.focus();if(ui.tab==='date'&&date&&date!==ui.sel)toast('Task added for '+shortDate(date));}
      return;
    }
    const b=e.target.closest('[data-act]');if(b)todoAct(b.dataset.act,b.dataset.id,b);
  });
  el.todoBody.addEventListener('change',e=>{if(e.target.id==='tdDate'&&/^\d{4}-\d\d-\d\d$/.test(e.target.value)){ui.sel=e.target.value;ui.editing=null;renderTodo();}});
  const enterKey=e=>{
    if(e.key!=='Enter')return;
    const t=e.target;
    if(t.id==='tdIn'){e.preventDefault();$('#tdAdd').click();}
    else if(t.id==='calTaskIn'){e.preventDefault();$('#calTaskAdd').click();}
    else if(t.hasAttribute&&(t.hasAttribute('data-edit-text')||t.hasAttribute('data-edit-date'))){e.preventDefault();t.closest('.tk-row').querySelector('[data-act=save]').click();}
  };
  el.todoBody.addEventListener('keydown',enterKey);el.calDay.addEventListener('keydown',enterKey);

  // the tree: tap a ripe apple
  canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();tryPick(e.clientX-r.left,e.clientY-r.top);});
  canvas.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch')return;
    const r=canvas.getBoundingClientRect();
    canvas.style.cursor=hoverPick(e.clientX-r.left,e.clientY-r.top)?'pointer':'';
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(el.subjPanel.classList.contains('open')){closeSubj();el.subjBtn.focus();return;}
      if(isOpen(el.confirm)){closeConfirm();return;}
      if(ui.editing){ui.editing=null;refreshTodos();return;}
      if(isOpen(el.repModal)){closeRep();return;}
      if(isOpen(el.calModal)){closeCal();return;}
      if(isOpen(el.todoModal)){closeTodo();return;}
      if(isOpen(el.settings)){closeSettings();return;}
      closePops();return;
    }
    if(e.code==='Space'&&!e.repeat&&spaceOK(e)){e.preventDefault();toggleTimer();}
  });
  document.addEventListener('keyup',e=>{if(e.code==='Space'&&spaceOK(e))e.preventDefault();});   // stop Space from "clicking" a focused button
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();else if(bk.ready)bkWrite();});
  const persist=()=>{if(T.status==='running'){bankFocus();T.lastTick=Date.now();}flushNote();save();};
  window.addEventListener('beforeunload',persist);
  window.addEventListener('pagehide',persist);
  // browsers only allow audio after a gesture: resume the sounds that were playing on the first touch
  const unlock=()=>{
    document.removeEventListener('pointerdown',unlock);
    if(state.amb.on.length){ensureAudio();[...state.amb.on].forEach(ambStart);renderAmb();}
  };
  document.addEventListener('pointerdown',unlock);

  if('ResizeObserver' in window)new ResizeObserver(()=>resizeScene()).observe(sceneEl);
  else window.addEventListener('resize',resizeScene);
}

/* ================================ INIT ================================ */
function startWorkerTick(){   // background tabs throttle timers; a worker keeps phases ending on time
  try{
    const w=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},500)'],{type:'text/javascript'})));
    w.onmessage=()=>{if(document.hidden)tick();};
  }catch(e){}
}
function init(){
  applyCursor();buildSettings();buildSky();buildAmb();buildSubjects();PL.ready=plLoad();
  restoreTimer();
  const min=state.ui.min==null?window.innerWidth<760:!!state.ui.min;
  el.dash.classList.toggle('min',min);el.dash.classList.toggle('shut',min);el.dashToggle.setAttribute('aria-expanded',String(!min));
  bindEvents();
  resizeScene();
  scene.g=0;
  syncDay();
  updateAll();
  try{const n=sessionStorage.getItem('sg.note');if(n){sessionStorage.removeItem('sg.note');setTimeout(()=>toast(n),600);}}catch(e){}
  if(bkNote)toast(bkNote==='restored'?'Your study data was restored from StudyGrove-Data.js':'Your backup file was merged in');
  bkInit();renderFull();renderClock();
  save();
  setInterval(tick,250);startWorkerTick();clockLoop();
  requestAnimationFrame(frame);
  if(awayNotice)toast('Your timer was paused: you were away for a long while.');
}
init();
})();
</script>
</body>
</html>
