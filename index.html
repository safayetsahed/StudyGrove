/* ========================== GROWTH MODEL ========================== */
// keyframes: [focused minutes, visual maturity 0..1]
const KF=[[0,0],[2,.006],[6,.016],[12,.034],[20,.07],[30,.105],[60,.19],[180,.42],[360,.65],[720,.85],[1800,1]];
function growthOf(m){
  m=fin(m);if(m<=0)return 0;
  for(let i=1;i<KF.length;i++){if(m<=KF[i][0]){const a=KF[i-1],b=KF[i];return lerp(a[1],b[1],(m-a[0])/(b[0]-a[0]));}}
  return 1;
}
const STAGES=[
  {name:'Seed',           from:0,   range:'0 – 30m',  mid:0,    note:'A seed stirs beneath the soil.'},
  {name:'Seedling',       from:30,  range:'30m – 1h', mid:45,   note:'A small plant reaches for the light.'},
  {name:'Young Tree',     from:60,  range:'1h – 3h',  mid:120,  note:'Branches begin to reach outward.'},
  {name:'Developing Tree',from:180, range:'3h – 6h',  mid:290,  note:'The canopy fills and blossoms open.'},
  {name:'Mature Tree',    from:360, range:'6h – 12h', mid:540,  note:'Green apples begin to form.'},
  {name:'Bountiful Tree', from:720, range:'12h+',     mid:1500, note:'Ripe apples hang from every branch.'}
];
const FULL_MIN=KF[KF.length-1][0];
// the grove: smaller trees join the main tree one by one, starting after ~5 hours of study
const FOREST_START=300,FOREST_GAP=190,FOREST_GROW=600,FOREST_N=14;
const FOREST_FULL=FOREST_START+(FOREST_N-1)*FOREST_GAP+FOREST_GROW;
const forestPct=m=>clamp(m/FOREST_FULL,0,1);
const liteGrowth=(m,i)=>Math.pow(clamp((m-FOREST_START-i*FOREST_GAP)/FOREST_GROW,0,1),1.15);
function stageIndex(m){let i=0;for(let k=0;k<STAGES.length;k++)if(m>=STAGES[k].from)i=k;return i;}
function stageNote(i,m){
  if(i===0){
    if(m<=0)return'Your seed is waiting beneath the soil.';
    if(m<4)return'The seed cracks open…';
    if(m<14)return'A tiny shoot rises toward the light.';
    return'Your first leaves are unfurling.';
  }
  return STAGES[i].note;
}

/* ============================ TREE ENGINE ============================ */
const NSEG=5;
function buildTree(seed,lite){
  const r=mulberry32((seed*7919+13)|0);
  const R=(a,b)=>a+(b-a)*r();
  const branches=[],leaves=[],slots=[];
  const WID=[[32,18],[17,10],[9.5,5.5],[5,2.8],[2.6,1.4]];
  const APPEAR=[[.004,.004],[.10,.19],[.24,.40],[.36,.56],[.50,.74]];
  const SPAN=[.45,.27,.24,.2,.14];
  const droop=a=>Math.cos(a)*.16;
  // growth progress (0..1) at which a child attached at fraction ta has been reached by its parent
  const xFor=ta=>ta>=.995?.96:1-Math.sqrt(1-ta);
  function mk(parent,ta,ang,len,bend,absAng){
    const depth=parent?parent.depth+1:0;
    const rel=!!parent&&ta>=1;            // terminal buds ride the growing tip of their parent
    const range=APPEAR[depth];
    let ap=R(range[0],range[1]);
    if(parent){
      if(rel)ap=Math.max(ap,parent.ap+parent.span*.5);
      else{
        const need=parent.depth===0?parent.ap+parent.span*(1-Math.pow(1-ta,1/2.6)):parent.ap+parent.span*xFor(ta);
        ap=Math.max(ap,need+.004);       // never pop in before the parent has grown that far
      }
    }
    const b={parent,depth,ta,rel,ang,len,bend,absAng,ap,span:SPAN[depth],
      w0:WID[depth][0]*R(.93,1.07),w1:WID[depth][1],delay:depth*.17+r()*.25,
      f:0,vis:false,wv:0,
      px:new Float32Array(NSEG+1),py:new Float32Array(NSEG+1),pa:new Float32Array(NSEG+1)};
    branches.push(b);
    return b;
  }
  function addKids(b){
    const d=b.depth;if(lite&&d>=3)return;let specs;
    if(d===1)specs=[.42,.7,1];else if(d===2)specs=[.5,.75,1];else if(d===3)specs=[.6,1];else return;
    const s=r()<.5?-1:1;
    specs.forEach((ta,i)=>{
      const ang=ta===1?R(-.25,.25):(i%2===0?-s:s)*R(.45,.85);
      const len=d===1?R(80,105):d===2?R(52,72):R(30,44);
      const abs=b.absAng+b.bend*ta+ang;
      const c=mk(b,ta,ang,len,R(-.2,.2)+droop(abs)*(d>=2?1.3:1),abs);
      addKids(c);
    });
  }
  const trunk=mk(null,0,-Math.PI/2+R(-.04,.04),130,R(-.1,.1),-Math.PI/2);
  [[.55,-1],[.72,1],[.86,-1]].forEach(([ta,side])=>{
    const ang=side*R(.8,1.05),abs=trunk.absAng+trunk.bend*ta+ang;
    addKids(mk(trunk,ta,ang,R(120,148),R(-.3,.3)+droop(abs),abs));
  });
  addKids(mk(trunk,1,R(-.3,.3),95,R(-.2,.2),-Math.PI/2));

  // regular leaves (inner branches leaf out early so young trees never look bare)
  for(const b of branches){
    if(b.depth===0)continue;
    const cnt=(lite?[0,6,5,4,0]:[0,8,8,7,9])[b.depth];
    const sz=[null,[16,22],[15,21],[14,19],[13,18]][b.depth];
    const early=[0,.1,.15,.25,.25][b.depth],reach=[0,.4,.45,.55,.55][b.depth];
    for(let i=0;i<cnt;i++){
      const tip=i===cnt-1,ta=tip?1:R(.25,.98);
      const ap=Math.max(b.ap+b.span*(early+reach*ta),b.ap+b.span*xFor(ta)+.002)+R(0,.02);
      leaves.push({b,ta,rel:false,side:i%2?1:-1,ao:tip?R(0,.35):R(.45,1.25),sz:R(sz[0],sz[1]),col:(r()*5)|0,
        ap:Math.min(.97,ap),ph:r()*TAU,van:0});
    }
  }
  // sprout leaves along the young stem: they fall away as the trunk matures
  [[.96,.012,.42],[.96,.012,.42],[.8,.03,.38],[.8,.03,.38],[.64,.052,.35],[.64,.052,.35],[.48,.085,.31],[.48,.085,.31],[.34,.11,.28],[.34,.11,.28]]
    .forEach((s,i)=>leaves.push({b:trunk,ta:s[0],rel:true,side:i%2?1:-1,ao:R(.9,1.3),sz:i<2?R(12,14):R(15,19),col:5,ap:s[1],ph:r()*TAU,van:s[2]}));

  // fruit and blossom slots on twig tips
  const twigs=branches.filter(b=>b.depth===4);
  for(let i=twigs.length-1;i>0;i--){const j=(r()*(i+1))|0;const t=twigs[i];twigs[i]=twigs[j];twigs[j]=t;}
  const nFruit=Math.min(34,twigs.length),nBlos=Math.min(22,twigs.length-nFruit);
  twigs.slice(0,nFruit+nBlos).forEach((b,i)=>{
    const fruit=i<nFruit;
    const ap=Math.min(.87,Math.max(R(.64,.93),b.ap+b.span*.92));   // capped so every apple can fully ripen
    slots.push({id:'a'+i,b,fruit,ap,bs:R(.46,.52),be:fruit?ap+.01:R(.6,.72),sz:R(.88,1.14),off:R(-3,3),ph:r()*TAU,lx:0,ly:0,lr:0,rp:0,pick:false});
  });
  const leafy=branches.filter(b=>b.depth>=2);
  const buf=Array.from({length:6},()=>new Float32Array(leaves.length*4));
  return{branches,leaves,slots,leafy,buf,cnt:new Int32Array(6)};
}
const hashStr=t=>{let h=7;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h;};
const daySeed=k=>((state.seed*31)^hashStr(k))|0;          // every study day grows its own tree, and a finished day's tree is rebuilt from the same seed
let tree=buildTree(daySeed(studyDay()));

const LEAF_COL=['#1f5a3c','#276c47','#2f7f52','#3b9462','#4aaa72','#6fcf90'];
const STEM=hex('#4fae6b'),BARK_T=hex('#5b4030'),TENDER=hex('#5f9f66');
const BRK=[null,hex('#58402f'),hex('#654733'),hex('#715238'),hex('#7d5d3f')];
const AMP=[0,.016,.026,.04,.055];
const APPLE_STOPS=[[0,hex('#78b955')],[.4,hex('#c3d35a')],[.7,hex('#e36a45')],[1,hex('#c9303a')]];
function appleCol(rp){
  for(let i=1;i<APPLE_STOPS.length;i++){if(rp<=APPLE_STOPS[i][0]){const a=APPLE_STOPS[i-1],b=APPLE_STOPS[i];return mix(a[1],b[1],(rp-a[0])/(b[0]-a[0]));}}
  return APPLE_STOPS[APPLE_STOPS.length-1][1];
}
function wind(t){return Math.sin(t*.62)*.55+Math.sin(t*1.31+1.3)*.3+Math.sin(t*.27+.4)*.4;}

function updateTree(tr,g,t,ws){
  const gust=Math.max(0,Math.sin(t*.37)*Math.sin(t*.11+2));
  const wsc=ws*(1+gust*.9);
  const brs=tr.branches;
  for(let n=0;n<brs.length;n++){
    const b=brs[n];
    const x=clamp((g-b.ap)/b.span,0,1);
    const f=b.depth===0?1-Math.pow(1-x,2.6):1-(1-x)*(1-x);
    b.f=f;
    const p=b.parent;
    let vis=f>.003;
    if(p&&vis&&(!p.vis||(!b.rel&&p.f<b.ta-.002)))vis=false;
    b.vis=vis;
    if(!vis)continue;
    let x0,y0,a0;
    if(!p){x0=0;y0=0;a0=b.ang;}
    else{
      const q=(b.rel?1:clamp(b.ta/p.f,0,1))*NSEG;let i=q|0;if(i>=NSEG)i=NSEG-1;const u=q-i;
      x0=p.px[i]+(p.px[i+1]-p.px[i])*u;y0=p.py[i]+(p.py[i+1]-p.py[i])*u;a0=p.pa[i]+(p.pa[i+1]-p.pa[i])*u+b.ang;
    }
    b.wv=wind(t-b.delay);
    const amp=b.depth===0?lerp(.11,.012,smooth(g/.5)):AMP[b.depth];
    const sw=b.wv*amp*wsc;
    const step=b.len*f/NSEG;
    let X=x0,Y=y0;
    b.px[0]=X;b.py[0]=Y;
    for(let k=0;k<NSEG;k++){
      const u=(k+.5)/NSEG;
      const a=a0+b.bend*u+sw*u;
      b.pa[k]=a;X+=Math.cos(a)*step;Y+=Math.sin(a)*step;
      b.px[k+1]=X;b.py[k+1]=Y;
    }
    b.pa[NSEG]=b.pa[NSEG-1];
  }
}

function drawBranches(ctx,tr,g){
  const wsAll=.22+.78*Math.pow(g,.6),wsT=.07+.93*Math.pow(g,.75);
  const trunkCol=mix(STEM,BARK_T,smooth((g-.05)/.25));
  const trunk=tr.branches[0];
  if(trunk.vis&&g>.015){
    const bw=Math.max(1.4,trunk.w0*wsT);
    ctx.fillStyle=rgb(mix(trunkCol,[20,12,8],.28));
    ctx.beginPath();ctx.ellipse(0,1.5,bw*.82,bw*.26,0,0,TAU);ctx.fill();
  }
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const b of tr.branches){
    if(!b.vis)continue;
    const k=b.depth===0?wsT:wsAll;
    let base;
    if(b.depth===0)base=trunkCol;
    else{const youth=1-smooth((g-(b.ap+b.span))/.1);base=mix(BRK[b.depth],TENDER,b.depth>=2?youth*.55:youth*.3);}
    const w0=Math.max(1.4,b.w0*k),w1=Math.max(.9,b.w1*k);
    ctx.fillStyle=rgb(base);
    ctx.beginPath();
    for(let i=0;i<=NSEG;i++){
      const a=b.pa[i],w=(w0+(w1-w0)*i/NSEG)*.5,lx=b.px[i]-Math.sin(a)*w,ly=b.py[i]+Math.cos(a)*w;
      if(i===0)ctx.moveTo(lx,ly);else ctx.lineTo(lx,ly);
    }
    for(let i=NSEG;i>=0;i--){
      const a=b.pa[i],w=(w0+(w1-w0)*i/NSEG)*.5;
      ctx.lineTo(b.px[i]+Math.sin(a)*w,b.py[i]-Math.cos(a)*w);
    }
    ctx.closePath();ctx.fill();
    if(b.depth<=1&&w0>3){
      ctx.strokeStyle='rgba(255,225,180,.11)';ctx.lineWidth=Math.max(1,w0*.2);
      ctx.beginPath();
      for(let i=0;i<=NSEG;i++){
        const a=b.pa[i],w=(w0+(w1-w0)*i/NSEG)*.5*.45,x=b.px[i]-Math.sin(a)*w,y=b.py[i]+Math.cos(a)*w;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    if(b.depth===0&&w0>8){
      ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=1;
      for(const off of[-.26,.1]){
        ctx.beginPath();
        for(let i=0;i<=NSEG;i++){
          const a=b.pa[i],w=(w0+(w1-w0)*i/NSEG)*.5*off*2,x=b.px[i]-Math.sin(a)*w,y=b.py[i]+Math.cos(a)*w;
          if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
    }
  }
}

function leafPath(ctx,x,y,a,L){
  const ca=Math.cos(a),sa=Math.sin(a),w=L*.5;
  const mx=x+ca*L*.55,my=y+sa*L*.55;
  ctx.moveTo(x,y);
  ctx.quadraticCurveTo(mx-sa*w,my+ca*w,x+ca*L,y+sa*L);
  ctx.quadraticCurveTo(mx+sa*w,my-ca*w,x,y);
}

function drawLeaves(ctx,tr,g,t){
  // soft canopy shadow blobs give the foliage depth
  if(g>.2){
    // two concentric passes: a wide faint halo and a denser core, so the edge reads as soft shade, not a disc
    for(let pass=0;pass<2;pass++){
      ctx.fillStyle='rgba(8,46,30,'+((pass?.3:.2)*(1-.85*clamp(sky.d+sky.w*.5,0,1)))+')';ctx.beginPath();
      for(const b of tr.leafy){
        if(!b.vis||b.f<.4)continue;
        const r=(b.depth===2?36:b.depth===3?30:22)*smooth((g-b.ap-b.span*.4)/.25)*(pass?.6:1);
        if(r<2)continue;
        const x=b.px[NSEG],y=b.py[NSEG];ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,TAU);
      }
      ctx.fill();
    }
  }
  const cnt=tr.cnt;cnt.fill(0);
  const sizeK=lerp(.75,1.08,smooth(g));
  for(const L of tr.leaves){
    const b=L.b;if(!b.vis)continue;
    let sc=smooth((g-L.ap)/.05);
    if(L.van)sc*=1-smooth((g-L.van)/.06);
    if(sc<.03)continue;
    let tt;
    if(L.rel)tt=L.ta;else{if(b.f<L.ta-.002)continue;tt=clamp(L.ta/b.f,0,1);}
    const q=tt*NSEG;let i=q|0;if(i>=NSEG)i=NSEG-1;const u=q-i;
    const x=b.px[i]+(b.px[i+1]-b.px[i])*u,y=b.py[i]+(b.py[i+1]-b.py[i])*u;
    const a=b.pa[i]+(b.pa[i+1]-b.pa[i])*u+L.side*L.ao+Math.sin(t*2.1+L.ph)*(.1+.14*Math.abs(b.wv));
    const c=L.col,n=cnt[c],buf=tr.buf[c];
    buf[n*4]=x;buf[n*4+1]=y;buf[n*4+2]=a;buf[n*4+3]=L.sz*sc*sizeK;cnt[c]=n+1;
  }
  for(let c=0;c<6;c++){
    const n=cnt[c];if(!n)continue;
    const buf=tr.buf[c];
    ctx.beginPath();
    for(let i=0;i<n;i++)leafPath(ctx,buf[i*4],buf[i*4+1],buf[i*4+2],buf[i*4+3]);
    ctx.fillStyle=LEAF_COL[c];ctx.fill();
  }
}

function drawApple(ctx,x,y,r,rp,tx,ty){
  if(tx!==undefined){
    ctx.strokeStyle='#5b3d26';ctx.lineWidth=Math.max(1,r*.12);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(x+r*.05,y-r*.85);ctx.stroke();
  }
  const c=appleCol(rp);
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=rgb(c);ctx.fill();ctx.clip();
  ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.arc(x+r*.58,y+r*.5,r*1.02,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.34)';ctx.beginPath();ctx.ellipse(x-r*.38,y-r*.4,r*.22,r*.13,-.6,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(20,5,5,.35)';ctx.beginPath();ctx.ellipse(x,y-r*.86,r*.3,r*.13,0,0,TAU);ctx.fill();
  ctx.restore();
  if(r>4){
    ctx.fillStyle='#3f9b5f';ctx.beginPath();leafPath(ctx,x+r*.08,y-r*.95,-.55,r*.95);ctx.fill();
  }
}

function drawFruit(ctx,tr,g,t,curMin){
  let ripe=0;
  const petals=[],centers=[];
  for(const s of tr.slots){
    const b=s.b;s.pick=false;s.lr=0;
    if(!b.vis||b.f<.55)continue;          // blossoms open on growing twigs; fruit waits for a finished twig
    const sway=Math.sin(t*1.5+s.ph)*1.3*(.4+Math.abs(b.wv));
    const tx=b.px[NSEG],ty=b.py[NSEG];
    const bl=smooth((g-s.bs)/.05)*(1-smooth((g-s.be)/.05));
    if(bl>.03){
      const z=(.7+.8*bl)*s.sz;
      petals.push(tx+s.off*.5,ty+1,z);centers.push(tx+s.off*.5,ty+1,z);
    }
    if(!s.fruit||b.f<.98)continue;
    let sc,rp;
    const hv=state.harvest[s.id];
    if(hv!==undefined){
      const since=curMin-hv;
      if(since<15)continue;
      sc=smooth((since-15)/40);rp=smooth((since-30)/60);
    }else{sc=smooth((g-s.ap)/.1);rp=smooth((g-s.ap-.05)/.1);}
    if(sc<.03)continue;
    const r=Math.max(1.4,10.5*s.sz*sc);
    const ax=tx+s.off+sway,ay=ty+r*1.2+1;
    drawApple(ctx,ax,ay,r,rp,tx,ty);
    s.lx=ax;s.ly=ay;s.lr=r;s.rp=rp;
    if(sc>.85&&rp>.8){s.pick=true;ripe++;}
  }
  if(petals.length){
    ctx.fillStyle='#fbe3ea';ctx.beginPath();
    for(let i=0;i<petals.length;i+=3){
      const x=petals[i],y=petals[i+1],z=petals[i+2];
      for(let k=0;k<5;k++){const a=k*TAU/5+i,px=x+Math.cos(a)*2.4*z,py=y+Math.sin(a)*2.4*z;ctx.moveTo(px+2.1*z,py);ctx.arc(px,py,2.1*z,0,TAU);}
    }
    ctx.fill();
    ctx.fillStyle='#f4c96b';ctx.beginPath();
    for(let i=0;i<centers.length;i+=3){const x=centers[i],y=centers[i+1],z=centers[i+2];ctx.moveTo(x+1.5*z,y);ctx.arc(x,y,1.5*z,0,TAU);}
    ctx.fill();
  }
  return ripe;
}

function seedShape(ctx){
  ctx.beginPath();ctx.ellipse(0,0,10,6.4,-.2,0,TAU);ctx.fillStyle='#7b5030';ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(1.5,2.4,8,3.6,-.2,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,230,190,.35)';ctx.beginPath();ctx.ellipse(-3,-2.2,3.6,1.5,-.4,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(40,20,8,.6)';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(-9,-.6);ctx.quadraticCurveTo(0,1.6,9,0);ctx.stroke();
}
function drawSeed(ctx,g,t){
  const a=1-smooth((g-.006)/.008);if(a<=.01)return;
  const k=smooth(g/.008),pulse=.5+.5*Math.sin(t*2);
  ctx.save();ctx.globalAlpha=a;ctx.translate(0,-5.5+k*1.5);
  ctx.fillStyle='rgba(139,224,189,'+(.05+.05*pulse+.18*k)+')';ctx.beginPath();ctx.arc(0,0,16+6*k+3*pulse,0,TAU);ctx.fill();
  if(g<.0005){ctx.strokeStyle='rgba(139,224,189,'+(.14+.22*pulse)+')';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,22+5*pulse,0,TAU);ctx.stroke();}
  for(const side of[-1,1]){
    ctx.save();ctx.translate(side*k*3.2,0);ctx.rotate(side*k*.35);
    ctx.beginPath();ctx.rect(side<0?-24:0,-24,24,48);ctx.clip();
    seedShape(ctx);ctx.restore();
  }
  ctx.restore();
}

/* =============================== SCENE =============================== */
const canvas=el.tree,ctx=canvas.getContext('2d'),sceneEl=el.scene;
const scene={W:0,H:0,dpr:1,s:1,cx:0,gy:0,baseY:0,skyC:null,landC:null,stars:[],grass:[],flies:[],air:[],mood:0,g:0,gTarget:0,ripe:0,moon:null,sunY0:0,hw:0};
const parts=[];

function groundLogicalY(x){const xs=scene.cx+x*scene.s,t=clamp(xs/scene.W,0,1),u=t*(1-t);return 17-68*u;}

function resizeScene(){
  const r=sceneEl.getBoundingClientRect();
  const W=Math.max(220,Math.round(r.width)),H=Math.max(220,Math.round(r.height));
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(W===scene.W&&H===scene.H&&dpr===scene.dpr&&scene.skyC)return;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  scene.W=W;scene.H=H;scene.dpr=dpr;
  scene.baseY=H-Math.max(104,H*.15);
  scene.s=clamp(Math.min(W/720,(scene.baseY-100)/450,1.25),.3,1.25);
  scene.cx=W/2;scene.gy=scene.baseY-9*scene.s;scene.hw=W/(2*scene.s);
  const rs=mulberry32(4242);
  scene.stars=Array.from({length:80},()=>({x:rs()*W,y:rs()*scene.baseY*.72,r:.4+rs()*1.1,ph:rs()*TAU,sp:.6+rs()*1.8}));
  scene.grass=[];
  const gw=W/scene.s;
  for(let i=0;i<170;i++){
    const x=(rs()-.5)*gw;
    if(Math.abs(x)<100)continue;
    scene.grass.push({x,y:groundLogicalY(x)+rs()*6,h:6+rs()*13,lean:(rs()-.5)*6,c:rs()<.55?1:0});
  }
  scene.flies=Array.from({length:16},()=>({ax:80+rs()*220,ay:60+rs()*150,fx:.2+rs()*.4,fy:.25+rs()*.4,px:rs()*TAU,py:rs()*TAU,cy:-90-rs()*240,ph:rs()*TAU}));
  scene.air=Array.from({length:9},()=>({y:.14+rs()*.5,len:90+rs()*150,v:.012+rs()*.02,o:rs(),amp:8+rs()*16,w:1+rs()*1.2}));
  scene.moon={x:W*.82,y:Math.max(70,H*.17),r:clamp(W*.03,14,26)};
  scene.sunY0=scene.baseY-H*.10;
  placeForest();
  skyKey='';updateSky(0,true);
}

/* ------------------------------ sky system ------------------------------ */
const PAL=(()=>{
  const c=a=>a.map(hex),o=(sky,glow,h1,h2,gr,gl,soil)=>({sky:c(sky),glow,h1:c(h1),h2:c(h2),gr:c(gr),gl,soil:c(soil)});
  return{
    night:o(['#040a12','#0a1d29','#0f3331','#16463d'],[64,200,150,.26],['#0d3330','#0a2622'],['#0a2a26','#071c19'],['#17402f','#0d2a20','#06130f'],[139,224,189,.2],['#46321f','#1d130c']),
    day:o(['#2f74b5','#63aedb','#a8dce2','#dcefd2'],[255,238,170,.34],['#4c9a86','#3a7f6c'],['#2f7a55','#22603f'],['#3f8f4f','#2c6d3b','#17402a'],[210,255,200,.3],['#6a4a2b','#392513']),
    sunrise:o(['#2b3470','#7d5c98','#e89a74','#ffd596'],[255,190,120,.42],['#4a4a66','#34364e'],['#2c4a42','#1e3630'],['#33603f','#234a30','#102a1c'],[255,214,160,.28],['#5a3f28','#2a1a10']),
    sunset:o(['#262d5c','#8c4f7c','#e2704f','#ffb35c'],[255,150,90,.44],['#4d3f5a','#322a42'],['#30423f','#1f302e'],['#3a5a3a','#274530','#10261a'],[255,190,130,.26],['#5a3a24','#2a170e'])
  };
})();
const pmix=(a,b,t)=>typeof a==='number'?a+(b-a)*t:a.map((v,i)=>pmix(v,b[i],t));
const pmixO=(A,B,t)=>{const o={};for(const k in A)o[k]=pmix(A[k],B[k],t);return o;};
const palAt=(d,w,wt)=>pmixO(pmixO(PAL.night,PAL.day,d),pmixO(PAL.sunrise,PAL.sunset,wt),w*.92);
// ---- the sky follows one continuous "time of day" u in [0,4): 0-1 Morning, 1-2 Afternoon, 2-3 Evening, 3-4 Night.
// The sun rises at u=0, is highest at 1.5 and sets at 3; the moon rises just after the sunset, crosses the sky and sets before u=4.
const sky={u:0,d:0,w:0,wt:0,sa:0,sx:0,sy:0,se:0,ma:0};
let skyKey='';
const PHASES=['Morning','Afternoon','Evening','Night'];
const SKY_ANCHOR={morning:.55,afternoon:1.5,evening:2.55,night:3.5};
const AUTO_SEC=5400,AUTO_START=.12;        // Auto: each phase lasts 1h30m of focus, and the light moves continuously through it
function autoU(sec){return(((fin(sec)/AUTO_SEC+AUTO_START)%4)+4)%4;}
function autoPhase(sec){const u=autoU(sec),i=Math.floor(u);return{u,i,now:PHASES[i],next:PHASES[(i+1)%4],toGo:(i+1-u)*AUTO_SEC};}
function skyTargetU(){return state.sky==='auto'?autoU(state.totalSeconds+pendingSeconds()):SKY_ANCHOR[state.sky];}
const bump=(c,x,wl,wr)=>{const dd=(((x-c+2)%4)+4)%4-2,v=dd<0?1+dd/wl:1-dd/wr;return smooth(clamp(v,0,1));};
let clkKey=-1;
function updateSky(dt,force){
  const tu=skyTargetU();
  if(force||sky.u==null)sky.u=tu;
  else{
    let diff=(((tu-sky.u)%4)+4)%4;
    if(diff>3.2)diff-=4;                                   // target slightly behind: ease back instead of circling round
    const sp=clamp(Math.abs(diff)*.7,.012,.22),step=Math.sign(diff)*Math.min(Math.abs(diff),sp*dt);
    sky.u=(((sky.u+step)%4)+4)%4;
  }
  const u=sky.u,e=u<3?Math.sin(Math.PI*u/3):-Math.sin(Math.PI*(u-3))*.4;   // below zero = under the ground
  const wd=bump(0,u,.28,.6),wu=bump(3,u,.65,.32);
  sky.d=smooth(clamp(e/.5,0,1));sky.w=Math.max(wd,wu);sky.wt=wu/(wu+wd+1e-6);
  sky.sa=u<3?1:u<3.25?smooth(1-(u-3)/.25):u>3.8?smooth((u-3.8)/.2):0;
  sky.se=Math.max(e,0);
  const mo=scene.moon;
  if(mo&&scene.W){
    const W=scene.W,H=scene.H,peak=Math.max(90,H*.15),y0=scene.baseY-H*.10+mo.r*1.9,ym=scene.baseY-H*.17+mo.r*2;   // y0: sun centre when fully behind the ridge
    const s=u<3?u/3:1-(u-3);
    sky.sx=lerp(W*.34,W*.92,s);sky.sy=y0-e*(y0-peak);
    const um=(u-3.05)/.9,me=um>0&&um<1?Math.sin(Math.PI*um):0;
    mo.x=lerp(W*.34,W*.92,clamp(um,0,1));mo.y=ym-me*(ym-peak*1.05);
    sky.ma=smooth(clamp(me/.12,0,1));
  }
  {const c=smooth(clamp((sky.d-.35)/.5,0,1)),ck=Math.round(c*30);   // daylight amount: stronger soft shadow keeps the white text readable
   if(ck!==clkKey&&el.clock){clkKey=ck;el.clock.style.setProperty('--clk-sh','rgba(3,22,32,'+(.42+.3*c).toFixed(2)+')');}}
  const key=Math.round(sky.d*160)+','+Math.round(sky.w*160)+','+Math.round(sky.wt*160);
  if(key!==skyKey){skyKey=key;const P=palAt(sky.d,sky.w,sky.wt);paintSky(P);paintLand(P);}
}
function layer(name,scale){
  const{W,H}=scene,w=Math.round(W*scale),h=Math.round(H*scale);
  let c=scene[name];
  if(!c||c.width!==w||c.height!==h){c=scene[name]=document.createElement('canvas');c.width=w;c.height=h;}
  const g=c.getContext('2d');g.setTransform(scale,0,0,scale,0,0);g.clearRect(0,0,W,H);
  return g;
}
function paintSky(P){
  const{W,H,baseY,cx}=scene,g=layer('skyC',1);
  const gr=g.createLinearGradient(0,0,0,baseY);
  [0,.45,.8,1].forEach((o,i)=>gr.addColorStop(o,rgb(P.sky[i])));
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.translate(cx,baseY);g.scale(1,.5);       // horizon glow
  const hg=g.createRadialGradient(0,0,0,0,0,W*.75);hg.addColorStop(0,rgb(P.glow,P.glow[3]));hg.addColorStop(1,rgb(P.glow,0));
  g.fillStyle=hg;g.fillRect(-W,-W,W*2,W*2);g.restore();
}
function paintLand(P){
  const{W,H,s,baseY,cx,gy}=scene,g=layer('landC',scene.dpr);
  function hill(base,amp,freq,ph,c1,c2){
    g.beginPath();g.moveTo(0,H);
    for(let x=0;x<=W;x+=6){g.lineTo(x,baseY-base-amp*(Math.sin(x*freq+ph)*.6+Math.sin(x*freq*2.3+ph*1.7)*.4));}
    g.lineTo(W,H);g.closePath();
    const q=g.createLinearGradient(0,baseY-base-amp,0,baseY);q.addColorStop(0,rgb(c1));q.addColorStop(1,rgb(c2));g.fillStyle=q;g.fill();
  }
  hill(H*.13,H*.035,.006,1.2,P.h1[0],P.h1[1]);
  hill(H*.07,H*.03,.009,3.1,P.h2[0],P.h2[1]);
  // ground dome
  g.beginPath();g.moveTo(0,baseY+8*s);g.quadraticCurveTo(cx,baseY-26*s,W,baseY+8*s);g.lineTo(W,H);g.lineTo(0,H);g.closePath();
  const gg=g.createLinearGradient(0,baseY-9*s,0,H);gg.addColorStop(0,rgb(P.gr[0]));gg.addColorStop(.4,rgb(P.gr[1]));gg.addColorStop(1,rgb(P.gr[2]));
  g.fillStyle=gg;g.fill();
  g.beginPath();g.moveTo(0,baseY+8*s);g.quadraticCurveTo(cx,baseY-26*s,W,baseY+8*s);
  g.strokeStyle=rgb(P.gl,P.gl[3]);g.lineWidth=1.5;g.stroke();
  // soil patch
  const sg=g.createLinearGradient(0,gy-12*s,0,gy+16*s);sg.addColorStop(0,rgb(P.soil[0]));sg.addColorStop(1,rgb(P.soil[1]));
  g.fillStyle=sg;g.beginPath();g.ellipse(cx,gy+2*s,120*s,14*s,0,0,TAU);g.fill();
  g.strokeStyle='rgba(255,220,170,.08)';g.lineWidth=1;g.beginPath();g.ellipse(cx,gy+1*s,118*s,12.500*s,0,Math.PI*1.08,Math.PI*1.92);g.stroke();
  g.fillStyle='rgba(0,0,0,.18)';
  [[-60,3],[-34,6],[40,4],[72,2],[18,7],[-82,1]].forEach(([x,y])=>{g.beginPath();g.ellipse(cx+x*s,gy+y*s,3.500*s,1.500*s,0,0,TAU);g.fill();});
}

/* ------------------------------ the grove ------------------------------ */
// [x as a fraction of the half-width, scale, distance 0 (near) .. 1 (far)] in the order the trees appear
const FSLOTS=[[-.50,.46,.15],[.54,.44,.25],[.80,.40,.45],[-.78,.38,.50],[-.34,.34,.85],[.36,.32,.90],[.94,.36,.60],[-.94,.35,.60],[-.64,.28,.95],[.68,.27,.95],[-.44,.26,1],[.46,.25,1],[.88,.28,.90],[-.86,.27,.90]];
let forest=[],forestOrder=[];
function weekStartKey(k){const d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+1)%7));return dateKey(d);}   // weeks run Saturday to Friday
function rebuildForest(){          // every finished study day of this week (since Saturday's reset) leaves its tree behind; history itself is never touched
  const today=studyDay(),list=[];
  const d=parseKey(weekStartKey(today));
  for(let n=0;n<7&&dateKey(d)<today;n++,d.setDate(d.getDate()+1)){
    const k=dateKey(d),sec=fin(Number(state.days[k]));
    if(sec>0)list.push({k,sec});
  }
  forest=list.map((o,i)=>({i,key:o.k,tr:buildTree(daySeed(o.k),true),g:0,tg:growthOf(o.sec/60),x:0,y:0,k:FSLOTS[i][1],depth:FSLOTS[i][2],flip:i%2?1:-1}));
  forestOrder=forest.slice().sort((a,b)=>b.depth-a.depth);   // far trees are painted first
  if(scene.hw)placeForest();
}
let curDay='';
function syncDay(){               // runs at start and whenever the study day turns over (3:00 AM by default)
  const sd=studyDay();
  if(sd===curDay)return;
  const turned=curDay!=='';curDay=sd;
  if(state.harvestDay!==sd){state.harvest={};state.harvestDay=sd;}
  tree=buildTree(daySeed(sd));
  rebuildForest();
  if(turned){scene.g=0;lastStage=0;save();toast('A new day begins · a fresh seed is planted');renderStats();}
}
function placeForest(){
  for(const f of forest){const sl=FSLOTS[f.i];f.x=sl[0]*scene.hw;f.y=groundLogicalY(f.x)-sl[2]*14;}
}

/* ============================= PARTICLES ============================= */
function spawn(p){if(parts.length<260)parts.push(p);}
function treeHeight(g){return 30+400*smooth(g*1.15);}
function burst(n,cy,spread){
  const cols=['255,226,150','150,240,200','255,255,255','190,255,225'];
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,v=40+Math.random()*(spread||150);
    spawn({k:'burst',x:(Math.random()-.5)*40,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,l:1.4+Math.random()*.8,m:2.2,sz:1.4+Math.random()*2.4,c:cols[(Math.random()*cols.length)|0]});
  }
}
function updateParticles(dt,t,g,focusing,ws){
  // rising growth sparks while studying
  if(focusing&&!reduceMotion&&Math.random()<dt*3.2){
    const h=treeHeight(g);
    spawn({k:'spark',x:(Math.random()-.5)*Math.min(70,20+h*.18),y:-Math.random()*h*.5,vx:0,vy:-(24+Math.random()*30),l:2.6,m:2.6,sz:1+Math.random()*1.6,ph:Math.random()*TAU,c:'170,240,205'});
  }
  // drifting leaves and petals from the canopy
  scene.leafT=(scene.leafT||0)-dt;
  if(scene.leafT<=0&&g>.3&&!reduceMotion){
    scene.leafT=2.5+Math.random()*3.5;
    const L=tree.leafy;
    for(let tries=0;tries<10;tries++){
      const b=L[(Math.random()*L.length)|0];
      if(b.vis&&b.f>.6){
        const petal=g>.46&&g<.72&&Math.random()<.65;
        spawn({k:petal?'petal':'leaf',x:b.px[NSEG],y:b.py[NSEG],vx:0,vy:20,l:1,m:1,sz:petal?3.2:9+Math.random()*4,rot:Math.random()*TAU,vr:(Math.random()-.5)*3,ph:Math.random()*TAU,col:(Math.random()*5)|0,rest:0});
        break;
      }
    }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(p.k==='spark'){
      p.l-=dt;p.y+=p.vy*dt;p.x+=Math.sin(p.l*3+p.ph)*10*dt;
    }else if(p.k==='burst'){
      p.l-=dt;p.vx*=1-1.1*dt;p.vy=p.vy*(1-1.1*dt)+70*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    }else if(p.k==='leaf'||p.k==='petal'){
      const gnd=groundLogicalY(p.x)-2;
      if(p.y<gnd){
        p.vx+=(wind(t)*26)*dt;p.vx*=1-.8*dt;
        p.x+=p.vx*dt+Math.sin(t*2+p.ph)*14*dt;p.y+=(26+Math.abs(Math.sin(t*1.5+p.ph))*14)*dt;p.rot+=p.vr*dt;
        if(p.y>=gnd){p.rest=1;}
      }else{p.rest-=dt*.35;if(p.rest<=0)p.l=0;}
    }else if(p.k==='apple'){
      p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      const gnd=groundLogicalY(p.x)-p.r*.9;
      if(p.y>=gnd){p.y=gnd;if(Math.abs(p.vy)>90){p.vy*=-.38;p.vx*=.6;}else{p.vy=0;p.vx*=.8;p.l-=dt*1.1;}}
    }
    if(p.l<=0){parts[i]=parts[parts.length-1];parts.pop();}
  }
}
function drawParticles(c){
  for(const p of parts){
    if(p.k==='spark'||p.k==='burst'){
      const a=clamp(p.l/p.m*2,0,1);
      c.fillStyle='rgba('+p.c+','+(a*.22)+')';c.beginPath();c.arc(p.x,p.y,p.sz*3,0,TAU);c.fill();
      c.fillStyle='rgba('+p.c+','+a+')';c.beginPath();c.arc(p.x,p.y,p.sz,0,TAU);c.fill();
    }else if(p.k==='leaf'){
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=p.rest>0&&p.rest<1?p.rest:1;
      c.fillStyle=LEAF_COL[p.col];c.beginPath();leafPath(c,0,0,0,p.sz);c.fill();c.restore();
    }else if(p.k==='petal'){
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=p.rest>0&&p.rest<1?p.rest:1;
      c.fillStyle='#fbe3ea';c.beginPath();c.ellipse(0,0,p.sz,p.sz*.6,0,0,TAU);c.fill();c.restore();
    }else if(p.k==='apple'){
      c.save();c.globalAlpha=clamp(p.l,0,1);drawApple(c,p.x,p.y,p.r,1);c.restore();
    }
  }
}

/* =========================== RENDER LOOP =========================== */
function pendingSeconds(){   // unsaved focus time of the current session (running or paused)
  if(!isFocus()||T.status==='idle')return 0;
  return T.status==='running'?Math.max(fin(T.banked),fin(elapsedNow())):Math.max(0,fin(T.banked));
}
function liveMinutes(){return daySec(studyDay())/60;}      // the tree grows from today's study only
// ONE source for every study figure: the saved day records (+ the running session). Today, week, calendar, goal % and the tree all read these.
function liveDay(k){         // the unsaved session's share of study day k
  if(!isFocus()||T.status==='idle')return 0;
  return Math.max(0,fin(T.segs[k]))+(k===studyDay()?Math.max(0,pendingSeconds()-fin(T.banked)):0);
}
function daySec(k){return Math.max(0,fin(Number(state.days[k]),0))+liveDay(k);}
function goalSec(){return Math.max(60,fin(S().goal,120)*60);}
function goalFrac(sec){return clamp(fin(sec/goalSec()),0,1);}

const perf={ema:16.7,low:false};
let lastFrame=performance.now(),frameNo=0;
function frame(now){
  const raw=now-lastFrame,dt=Math.min(.05,raw/1000);lastFrame=now;
  if(raw<250){perf.ema+=(raw-perf.ema)*.04;if(!perf.low&&perf.ema>26)perf.low=true;else if(perf.low&&perf.ema<19)perf.low=false;}
  if(scene.skyC&&!document.hidden){update(dt);render(now/1000);}
  if(T.status==='running'&&!document.hidden&&el.ringProg)renderRing();
  requestAnimationFrame(frame);
}
function update(dt){
  const m=liveMinutes(),k=Math.min(1,dt*2.4);
  scene.gTarget=growthOf(m);
  scene.g+=(scene.gTarget-scene.g)*k;
  if(Math.abs(scene.gTarget-scene.g)<1e-5)scene.g=scene.gTarget;
  for(const f of forest){f.g+=(f.tg-f.g)*k;if(Math.abs(f.tg-f.g)<1e-5)f.g=f.tg;}
  const focusing=T.status==='running'&&isFocus(),breaking=T.status==='running'&&!isFocus();
  const target=focusing?1:breaking?.35:0;
  scene.mood+=(target-scene.mood)*Math.min(1,dt*1.6);
  scene.focusing=focusing;
  updateSky(dt,false);
}
function drawMoon(mo,a,t){
  const{x,y,r}=mo,br=.5+.5*Math.sin(t*.4);
  ctx.globalAlpha=a;
  let gr=ctx.createRadialGradient(x,y,0,x,y,r*9);gr.addColorStop(0,'rgba(190,240,222,.26)');gr.addColorStop(.35,'rgba(150,220,200,.08)');gr.addColorStop(1,'rgba(150,220,200,0)');
  ctx.fillStyle=gr;ctx.fillRect(x-r*9,y-r*9,r*18,r*18);
  ctx.fillStyle='#e9f4ee';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(120,150,150,.16)';
  [[-.3,-.2,.28],[.35,.15,.2],[-.05,.45,.16]].forEach(([p,q,rr])=>{ctx.beginPath();ctx.arc(x+p*r,y+q*r,rr*r,0,TAU);ctx.fill();});
  gr=ctx.createRadialGradient(x,y,0,x,y,90);gr.addColorStop(0,'rgba(190,240,222,'+(.1+.06*br)+')');gr.addColorStop(1,'rgba(190,240,222,0)');
  ctx.fillStyle=gr;ctx.fillRect(x-90,y-90,180,180);
  ctx.globalAlpha=1;
}
function drawSun(mo,a,t){
  const x=sky.sx,y=sky.sy,r=mo.r*1.3;
  const col=mix([255,244,205],[255,150,86],Math.max(sky.w,clamp(1-sky.se/.45,0,1))),pul=.5+.5*Math.sin(t*.5);
  ctx.globalAlpha=a;
  const gr=ctx.createRadialGradient(x,y,0,x,y,r*13);
  gr.addColorStop(0,rgb(col,.5));gr.addColorStop(.18,rgb(col,.2+.04*pul));gr.addColorStop(1,rgb(col,0));
  ctx.fillStyle=gr;ctx.fillRect(x-r*13,y-r*13,r*26,r*26);
  ctx.globalAlpha=1;                                   // the disc itself never fades: it is hidden by the hills until it climbs above them
  ctx.fillStyle=rgb(mix(col,[255,255,255],.55));ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  return{x,y};
}
function shafts(x,y,col,a){
  if(a<.004)return;
  const H=scene.H,by=scene.baseY;
  for(let i=0;i<3;i++){
    const dx=-(.25+i*.2)*H,spread=34+i*22;
    const rg=ctx.createLinearGradient(x,y,x+dx,by);
    rg.addColorStop(0,'rgba('+col+','+a+')');rg.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);
    ctx.lineTo(x+dx+spread,by);ctx.lineTo(x+dx-spread,by);ctx.closePath();ctx.fill();
  }
}
function drawAir(t){           // slow ribbons of moving air, visible in daylight
  const{W,baseY}=scene,d=sky.d;
  ctx.lineCap='round';
  for(const o of scene.air){
    const p=(t*o.v*(1+.4*scene.mood)+o.o)%1,x=-o.len+(W+o.len*2)*p,y=o.y*baseY+Math.sin(t*.4+o.o*9)*10;
    ctx.strokeStyle='rgba(255,255,255,'+(Math.sin(p*Math.PI)*.2*d)+')';ctx.lineWidth=o.w;
    ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+o.len*.3,y-o.amp,x+o.len*.6,y+o.amp,x+o.len,y-o.amp*.4);ctx.stroke();
  }
}
function wash(x,y,r,col,a){    // additive light falling on the canopy
  if(a<.004)return;
  const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+col+','+a+')');gr.addColorStop(1,'rgba('+col+',0)');
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalCompositeOperation='source-over';
}
// each small tree is painted to its own sprite only when it has grown or the light has changed;
// every frame it is just drawn (and swayed) as an image, so a whole grove stays cheap
function paintLite(f,t,sc){
  const w=Math.ceil(560*sc),h=Math.ceil(470*sc);
  if(!f.cv)f.cv=document.createElement('canvas');
  if(f.cv.width!==w||f.cv.height!==h){f.cv.width=w;f.cv.height=h;}
  const c=f.cv.getContext('2d');
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,w,h);
  c.setTransform(sc,0,0,sc,w/2,h-30*sc);
  updateTree(f.tr,f.g,t,1);
  if(f.g>.0035){drawBranches(c,f.tr,f.g);drawLeaves(c,f.tr,f.g,t);}
  f.sc=sc;f.gDraw=f.g;f.sk=skyKey;
}
function drawGrove(t,ws){
  let budget=2;
  for(const f of forestOrder){
    if(f.g<.004)continue;
    const sx=scene.cx+f.x*scene.s,ext=330*f.k*scene.s;
    if(sx+ext<0||sx-ext>scene.W)continue;
    const sc=Math.max(.3,f.k*scene.s*Math.min(scene.dpr,1.5));
    const stale=!f.cv||f.sc!==sc||f.sk!==skyKey||Math.abs(f.g-f.gDraw)>.006||(f.g>.9999&&f.gDraw<.9999);
    if(stale){if(budget<=0&&!f.cv)continue;if(budget>0){paintLite(f,t,sc);budget--;}}
    const rr=20+190*smooth(f.g*1.1);
    ctx.save();ctx.translate(f.x,f.y);
    ctx.fillStyle='rgba(0,0,0,'+((.08+.12*smooth(f.g*3))*(1-.3*sky.d))+')';ctx.beginPath();ctx.ellipse(0,3*f.k,rr*f.k,rr*f.k*.13,0,0,TAU);ctx.fill();
    ctx.scale(f.k*f.flip,f.k);
    ctx.transform(1,0,-wind(t*.9-f.i*.8)*.02*ws,1,0,0);      // the whole tree leans with the wind
    ctx.drawImage(f.cv,-280,-440,560,470);
    ctx.restore();
  }
}
const GRASS_A=hex('#1d5a3f'),GRASS_B=hex('#2e7d57'),GRASS_A2=hex('#3f9a55'),GRASS_B2=hex('#5fba66');
function render(t){
  frameNo++;
  const{W,dpr,s,cx,gy}=scene,g=scene.g,mood=scene.mood;
  const d=sky.d,w=sky.w,night=clamp(1-d*1.7,0,1)*(1-w),sunA=sky.sa,mA=night*sky.ma;
  const ws=(reduceMotion?.4:1)*(1+.3*d);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(scene.skyC,0,0,W,scene.H);
  const stA=clamp(1-d*2-w*.35,0,1);                       // twinkling stars fade out as daylight rises
  if(stA>.01){
    ctx.fillStyle='#dff6ec';
    for(const st of scene.stars){ctx.globalAlpha=(.25+.6*(.5+.5*Math.sin(t*st.sp+st.ph)))*stA;ctx.fillRect(st.x,st.y,st.r,st.r);}
    ctx.globalAlpha=1;
  }
  const mo=scene.moon;
  if(mA>.01)drawMoon(mo,mA,t);
  const sun=sunA>.01?drawSun(mo,sunA,t):null;
  ctx.drawImage(scene.landC,0,0,W,scene.H);
  if(mA>.01)shafts(mo.x,mo.y,'200,245,225',(.032+.03*mood)*(.7+.3*Math.sin(t*.25))*mA);
  if(sun)shafts(sun.x,sun.y,'255,232,170',(.05+.04*mood)*(.75+.25*Math.sin(t*.25))*sunA*clamp(sky.se/.25,0,1));
  if(d>.04)drawAir(t);
  // world space
  ctx.save();ctx.translate(cx,gy);ctx.scale(s,s);
  const th=treeHeight(g);
  drawGrove(t,ws);
  const shR=26+250*smooth(g*1.1);
  ctx.fillStyle='rgba(0,0,0,'+((.1+.2*smooth(g*3))*(1-.3*d))+')';ctx.beginPath();ctx.ellipse(0,4,shR,shR*.13,0,0,TAU);ctx.fill();
  if(g>.02){
    const wg=ctx.createRadialGradient(0,-th*.55,0,0,-th*.55,th*.95);
    wg.addColorStop(0,'rgba(255,214,140,'+(.04+.09*mood+.05*d)+')');wg.addColorStop(1,'rgba(255,214,140,0)');
    ctx.fillStyle=wg;ctx.fillRect(-th,-th*1.6,th*2,th*1.8);
  }
  updateTree(tree,g,t,ws);
  drawSeed(ctx,g,t);
  if(g>.0035){drawBranches(ctx,tree,g);drawLeaves(ctx,tree,g,t);}
  scene.ripe=g>.5?drawFruit(ctx,tree,g,t,liveMinutes()):0;
  if(g>.02){                                              // moonlight, sunlight or dawn glow on the crown
    const lx=th*.3,ly=-th*.8,lr=th*.75+60;
    wash(lx,ly,lr,'150,205,255',.075*night*(1-w*.5));
    wash(lx,ly,lr,'255,228,160',.11*sunA*(1-w));
    wash(lx,ly,lr,'255,160,96',.13*w);
  }
  // fireflies at night, drifting pollen by day
  const nightF=clamp(1-d*1.6,0,1),dayF=clamp(d*1.4-.2,0,1);
  if(nightF>.02){
    const nf=Math.floor(5+9*smooth((g-.1)/.8));
    for(let i=0;i<nf&&i<scene.flies.length;i++){
      const f=scene.flies[i];
      const x=f.ax*Math.sin(t*f.fx+f.px)*(.4+.6*smooth(g)),y=f.cy*(.5+.5*smooth(g))+f.ay*.5*Math.sin(t*f.fy+f.py);
      const a=(.35+.65*(.5+.5*Math.sin(t*1.7+f.ph)))*nightF;
      ctx.fillStyle='rgba(233,247,161,'+(.14*a)+')';ctx.beginPath();ctx.arc(x,y,9,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(240,250,180,'+a+')';ctx.beginPath();ctx.arc(x,y,1.7,0,TAU);ctx.fill();
    }
  }
  if(dayF>.02){
    for(let i=0;i<10;i++){
      const f=scene.flies[i];
      const x=f.ax*1.3*Math.sin(t*f.fx*.7+f.px)+t*6%40,y=f.cy*(.35+.4*smooth(g))+f.ay*.4*Math.sin(t*f.fy*.8+f.py);
      const a=(.3+.7*(.5+.5*Math.sin(t*1.1+f.ph)))*dayF;
      ctx.fillStyle='rgba(255,244,200,'+(.1*a)+')';ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,250,225,'+(.8*a)+')';ctx.beginPath();ctx.arc(x,y,1.2,0,TAU);ctx.fill();
    }
  }
  // foreground grass
  ctx.lineCap='round';ctx.lineWidth=1.7;
  for(let pass=0;pass<2;pass++){
    ctx.beginPath();
    for(const b of scene.grass){
      if(b.c!==pass)continue;
      const sw=wind(t*1.1+b.x*.012)*.8*ws;
      ctx.moveTo(b.x,b.y);ctx.quadraticCurveTo(b.x+sw*b.h*.25,b.y-b.h*.6,b.x+sw*b.h*.6+b.lean,b.y-b.h);
    }
    ctx.strokeStyle=rgb(pass?mix(GRASS_B,GRASS_B2,d):mix(GRASS_A,GRASS_A2,d));ctx.stroke();
  }
  updateParticles(Math.min(.05,1/60),t,g,scene.focusing,ws);
  drawParticles(ctx);
  ctx.restore();
}

function tryPick(px,py){
  const{cx,gy,s}=scene;
  let best=null,bd=1e9;
  for(const sl of tree.slots){
    if(!sl.pick)continue;
    const sx=cx+sl.lx*s,sy=gy+sl.ly*s,rr=sl.lr*s*1.5+8,dx=px-sx,dy=py-sy,d=dx*dx+dy*dy;
    if(d<=rr*rr&&d<bd){bd=d;best=sl;}
  }
  if(best)pick(best,px,py);
}
function hoverPick(px,py){
  const{cx,gy,s}=scene;
  for(const sl of tree.slots){
    if(!sl.pick)continue;
    const sx=cx+sl.lx*s,sy=gy+sl.ly*s,rr=sl.lr*s*1.5+8;
    if((px-sx)*(px-sx)+(py-sy)*(py-sy)<=rr*rr)return true;
  }
  return false;
}
function pick(sl,px,py){
  state.harvest[sl.id]=liveMinutes();
  state.picked++;state.hintSeen=true;
  spawn({k:'apple',x:sl.lx,y:sl.ly,vx:(Math.random()-.5)*50,vy:-70,r:sl.lr,l:3.2,m:3.2});
  sl.pick=false;
  const f=document.createElement('div');f.className='float-plus';f.textContent='+1 apple';f.style.left=px+'px';f.style.top=py+'px';
  sceneEl.appendChild(f);setTimeout(()=>f.remove(),1400);
  sfx('pop');save();renderStats();
  el.miniApples.classList.remove('pulse');void el.miniApples.offsetWidth;el.miniApples.classList.add('pulse');
}

/* ============================== TIMER ============================== */
// T.sel  = the mode picked in the dashboard: open | pomo | custom
// T.mode = the phase being timed: focus | short | long | free (open focus is a free-running stopwatch)
// Everything is derived from timestamps (T.startedAt), so a reload or a closed tab never loses time.
const isFocus=()=>T.mode==='focus'||T.mode==='free';
const isBreak=()=>T.mode==='short'||T.mode==='long';
const idleMode=()=>T.sel==='open'?'free':'focus';
let sessVer=0;
function modeDuration(m){
  if(m==='focus')return(T.sel==='custom'?state.customMin:S().focus)*60;
  return m==='short'?S().short*60:m==='long'?S().long*60:0;
}
function remainingNow(){
  if(T.mode==='free')return 0;
  if(T.status==='running')return Math.max(0,T.remaining-(Date.now()-T.startedAt)/1000);
  return T.remaining;
}
function elapsedNow(){
  if(T.mode==='free')return T.elapsed+(T.status==='running'?(Date.now()-T.startedAt)/1000:0);
  return T.total-remainingNow();
}
function resetTimerFor(mode){
  T.mode=mode;T.status='idle';T.total=modeDuration(mode);T.remaining=T.total;T.elapsed=0;T.startedAt=0;T.banked=0;T.segs={};T.sessionStart=0;T.sid='';T.subject='';
}
// Study time stays UNSAVED inside the running session (T.banked, split by study day in T.segs) until it is saved.
// Only Save (or a finished Pomodoro) moves it into the totals, the calendar and the tree; Reset throws it away.
function bankFocus(){
  if(!isFocus()||T.status!=='running')return;
  const e=elapsedNow(),d=e-T.banked;
  if(d>0){T.banked=e;const k=studyDay();T.segs[k]=fin(T.segs[k])+d;}
}
function commitFocus(){                       // unsaved session time becomes saved progress (once)
  let sum=0;
  for(const k of Object.keys(T.segs)){const v=fin(T.segs[k]);if(v>0){state.days[k]=fin(Number(state.days[k]))+v;sum+=v;}}
  state.totalSeconds=fin(state.totalSeconds)+sum;
  T.segs={};
}
// a saved session is written once: its id is checked before anything is added
function recordSession(done){
  if(!isFocus()||!(T.banked>=1))return false;
  const id=T.sid||('s'+(T.sessionStart||Date.now()));
  if(state.sessions.some(x=>x.id===id))return false;
  state.sessions.push({id,t:T.sessionStart||Date.now(),s:Math.round(T.banked),subject:T.subject||state.subject||'',kind:T.sel,done:!!done});
  commitFocus();
  sessVer++;return true;
}
const nextBreakMode=()=>(state.cycle>0&&state.cycle%S().every===0)?'long':'short';
function beginPhase(at){
  T.banked=0;T.segs={};T.elapsed=0;T.remaining=T.total;
  if(isFocus()){T.sessionStart=at;T.sid=uid();T.subject=state.subject;}
}
function needSubject(){
  const s=el.subjBtn;s.classList.remove('need');void s.offsetWidth;s.classList.add('need');
  openSubj();
  toast('Choose a subject before you start.');
}
function startTimer(){
  if(T.status==='running')return;
  if(isFocus()&&T.status==='idle'&&!state.subject){needSubject();return;}
  ensureAudio();
  const now=Date.now();
  if(T.status==='idle'){
    beginPhase(now);
    if(isFocus()&&state.totalSeconds===0)toast('Your seed is waking up…');
  }
  T.startedAt=now;T.status='running';T.lastTick=now;
  save();updateAll();
}
function pauseTimer(){
  if(T.status!=='running')return;
  bankFocus();
  const e=elapsedNow(),r=remainingNow();
  if(T.mode==='free')T.elapsed=e;else T.remaining=r;
  T.startedAt=0;T.status='paused';
  save();updateAll();
}
function toggleTimer(){T.status==='running'?pauseTimer():startTimer();}

function saveSession(){
  if(!isFocus()||T.status==='idle')return false;
  if(T.status==='running')bankFocus();
  if(!(T.banked>=1)){toast('Nothing to save yet.');return false;}
  const subj=T.subject||state.subject,secs=T.banked;
  if(!recordSession(false)){toast('This session is already saved.');return false;}
  resetTimerFor(idleMode());
  save();updateAll();refreshCal();
  toast('Saved · '+subj+' · '+fmtDur(secs));
  return true;
}
function confirmWipe(){
  askConfirm('Reset everything?','This erases every session, the tree and forest, your goals and settings, your music and sounds, and the backup file. It cannot be undone.',
    [{label:'Keep my data'},{label:'Continue…',cls:'warn',fn:()=>askConfirm('Are you absolutely sure?','All Study Grove data in this browser and in your backup file will be permanently deleted, and the app starts again from a seed.',
      [{label:'No, keep everything'},{label:'Erase everything',cls:'warn',fn:wipeAll}])}]);
}
async function wipeAll(){
  bk.reloading=true;clearTimeout(bk.t);bk.ready=false;      // nothing may write the old data back while we clean up
  let fileLeft=false;
  try{
    if(bk.file){
      let ok=(await bk.file.queryPermission({mode:'readwrite'}))==='granted';
      if(!ok)ok=(await bk.file.requestPermission({mode:'readwrite'}))==='granted';
      if(!ok)fileLeft=true;
      else{try{const w=await bk.file.createWritable();await w.write('/* Study Grove data was reset. */\n');await w.close();}catch(e){fileLeft=true;}}
    }else if(window.__STUDYGROVE_BACKUP)fileLeft=true;
  }catch(e){fileLeft=true;}

function deleteSession(id){        // removes a saved session completely: its day total, the tree, the reports and every count

  const d=parseKey(studyDay(s.t));
  for(let n=0;n<4&&rem>0;n++,d.setDate(d.getDate()+1)){
    const k=dateKey(d),v=fin(Number(state.days[k])),take=Math.min(rem,v);
    if(take>0){const nv=v-take;if(nv>0.5)state.days[k]=nv;else delete state.days[k];rem-=take;}
  }
  state.totalSeconds=Math.max(0,fin(state.totalSeconds)-(total0-rem));
  state.sessions.splice(i,1);state.deleted.push(id);if(state.deleted.length>400)state.deleted.shift();

// a focus or break phase ran out at `endAt`; `live` is false when this is found only after a reload
function completeSession(endAt,live){
  if(T.mode==='focus'){
    const d=T.total-T.banked;if(d>0){T.banked=T.total;const k=studyDay(endAt);T.segs[k]=fin(T.segs[k])+d;}
    const mins=Math.round(T.banked/60);
    recordSession(true);
    if(live){burst(26,-treeHeight(scene.g)*.6,120);chime('done');toast('Session complete · +'+mins+' min of growth');}
    else toast('A session finished while you were away · '+mins+' min saved');
    if(T.sel==='pomo'){
      state.cycle++;
      resetTimerFor(nextBreakMode());          // the break starts by itself
      T.startedAt=endAt;T.status='running';T.lastTick=Date.now();
    }else resetTimerFor('focus');
  }else{
    resetTimerFor('focus');
    if(live){
      chime('break');toast('Break over. Back to focus.');
      beginPhase(endAt);T.startedAt=endAt;T.status='running';T.lastTick=Date.now();   // and so does the next focus session
    }else toast('Your break ended while you were away. Ready when you are.');

function tick(){
  const now=Date.now();
  syncDay();
  if(bk.status==='wait'&&T.status==='idle')bkConnect();
  if(T.status==='running'){
    const live=now-(T.lastTick||now)<15000;
    let guard=0;
    while(T.status==='running'&&T.mode!=='free'&&remainingNow()<=0&&guard++<12)completeSession(T.startedAt+T.remaining*1000,live);
    if(T.status==='running'){bankFocus();T.lastTick=now;}
    if(guard){save();refreshCal();}
  }
  checkStage();renderTimer();renderStats();
  if(isOpen(el.repModal))renderReport();

  if(isOpen(el.calModal)){renderCalGrid();const dt=$('#dayTime');if(dt&&ui.sel===studyDay())setText(dt,fmtDur(daySec(ui.sel)));}
  if(now-lastSave>5000)save();
}
let awayNotice=false;
function restoreTimer(){
  if(T.status==='running'){
    const at=T.lastTick||T.startedAt;
    if(Date.now()-at>AWAY_MAX){
      // away for a very long time: pause at the last moment the timer was known to be alive
      const upto=Math.max(at,T.startedAt),used=(upto-T.startedAt)/1000;
      if(T.mode==='free')T.elapsed+=used;else T.remaining=Math.max(0,T.remaining-used);
      if(isFocus()){const e=T.mode==='free'?T.elapsed:T.total-T.remaining,d=e-T.banked;if(d>0){T.banked=e;const k=studyDay(upto);T.segs[k]=fin(T.segs[k])+d;}}
      T.status='paused';T.startedAt=0;awayNotice=true;
    }
  }
  if(T.mode!=='free'&&T.status==='idle'){T.total=modeDuration(T.mode);T.remaining=T.total;}
  if(T.mode!=='free'&&(!(T.total>0)||T.remaining>T.total))resetTimerFor(T.mode);
}
function applyDurations(){
  if(T.status==='idle'&&T.mode!=='free'){T.total=modeDuration(T.mode);T.remaining=T.total;}
}

// Ambient sounds are your own recordings, embedded in this file (no network). The short chimes are generated with WebAudio.
let AC=null,master=null,ambBus=null,sfxBus=null;
function ensureAudio(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
      AC=new C();
      master=AC.createGain();master.gain.value=state.amb.mute?0:1;master.connect(AC.destination);
      ambBus=AC.createGain();ambBus.gain.value=state.amb.vol;ambBus.connect(master);
      sfxBus=AC.createGain();sfxBus.gain.value=.6;sfxBus.connect(master);
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){return null;}
  return AC;
}
function tone(freq,t0,dur,vol,type){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(sfxBus);o.start(t0);o.stop(t0+dur+.05);
}
function chime(kind){
  if(!ensureAudio())return;
  const t=AC.currentTime+.02;
  const seq=kind==='done'?[523.25,659.25,783.99,1046.5]:kind==='level'?[392,523.25,659.25,783.99,1046.5,1318.5]:[659.25,523.25];
  seq.forEach((f,i)=>{tone(f,t+i*.15,kind==='break'?1.1:1.6,.22,'sine');tone(f*2,t+i*.15,.9,.05,'triangle');});
}
function sfx(kind){
  if(!ensureAudio())return;
  const t=AC.currentTime+.01;
  if(kind==='pop'){tone(660,t,.14,.24,'sine');tone(990,t+.05,.16,.16,'sine');}
}

/* ------------------------------ ambient sounds ------------------------------ */
// The built-in sounds are the four recordings supplied with the app (embedded at the end of this file, never synthesised).
// Each one plays through two <audio> elements that cross-fade into each other at the loop point, so there is no gap or click.
const AMB_LIST=[['morning','Morning','i-sunrise'],['music','Music','i-note'],['rain','Rain','i-rain'],['birds','Birds','i-bird']];
// trim: evens out the very different recording levels. xf: equal-power cross-fade seconds at the loop point.
// ov/fin: for recordings that already fade out at the end and in at the start (rain, the music clip) the next pass simply overlaps the natural tail, so the level stays even.
const SND_CFG={morning:{trim:4.2,xf:4},music:{trim:.2,ov:3.4,fin:1.5},rain:{trim:1,ov:5,fin:0},birds:{trim:4.4,xf:3.5}};
// The four recordings are your own MP3 files. You choose them once (File Explorer) and they are kept inside this browser's
// IndexedDB, so they play offline from then on. The bytes are stored exactly as they are on your disk.
const SND_NAMES={morning:/morning/i,music:/music/i,rain:/rain/i,birds:/bird/i};
const SND_URL={},PENDING=new Set(),WANT=new Set();   // WANT: sounds you asked for before their files were chosen
async function soundUrl(id){
  if(SND_URL[id])return SND_URL[id];
  if(PL.ready)await PL.ready;
  if(!PL.db)throw new Error('library unavailable');
  const rec=await dbReq('sounds','readonly',st=>st.get(id));
  if(!rec||!rec.blob){const e=new Error('missing '+id);e.missing=true;throw e;}
  return SND_URL[id]=URL.createObjectURL(rec.blob);
}
async function haveSounds(){
  if(PL.ready)await PL.ready;if(!PL.db)return{};
  const keys=await dbReq('sounds','readonly',st=>st.getAllKeys());return Object.fromEntries((keys||[]).map(k=>[k,1]));
}
function askSoundFiles(missing){
  askConfirm('Choose your sound files','Pick your '+(missing&&missing.length?missing.join(', '):'Morning, Music, Rain and Birds')+' MP3 files once. They are kept in this browser, so you will not need to choose them again.',
    [{label:'Choose files…',cls:'main',fn:()=>$('#sndFile').click()},{label:'Not now',fn:null}]);
}
async function importSounds(files){
  const got=[],skipped=[];
  for(const f of files){
    const id=Object.keys(SND_NAMES).find(k=>SND_NAMES[k].test(f.name));
    if(!id){skipped.push(f.name);continue;}
    try{await dbReq('sounds','readwrite',st=>st.put({id,name:f.name,size:f.size,blob:f}));delete SND_URL[id];got.push(id);}
    catch(e){console.error('Study Grove sounds:',e);toast('"'+f.name+'" could not be stored.');}
  }
  const have=await haveSounds(),miss=Object.keys(SND_NAMES).filter(k=>!have[k]);
  toast(got.length?'Loaded: '+got.join(', ')+(miss.length?' · still missing: '+miss.join(', '):' · all four ready'):'No matching files. Name them Morning, Music, Rain and Birds.');
  [...WANT].forEach(id=>{if(got.includes(id)){WANT.delete(id);ambStart(id);}});
  if(!isOpen(el.ambPop))togglePop('amb');
  renderAmb();
}
const XF_IN=Float32Array.from({length:64},(_,i)=>Math.sin(Math.PI/2*i/63)),XF_OUT=Float32Array.from({length:64},(_,i)=>Math.cos(Math.PI/2*i/63));
const AMB={};
const soundVol=id=>clamp(num(state.amb.vols[id],.8),0,1);
function makeLoop(id,url){
  const cfg=SND_CFG[id];
  const out=AC.createGain();out.gain.value=0;out.connect(ambBus);
  const vol=AC.createGain();vol.gain.value=cfg.trim*soundVol(id);vol.connect(out);
  const L={id,out,vol,alive:true,cur:0,xf:false,parts:[],iv:0,to:0};
  for(let k=0;k<2;k++){
    const a=new Audio();a.preload='auto';a.loop=false;a.src=url;
    const src=AC.createMediaElementSource(a),g=AC.createGain();g.gain.value=0;src.connect(g);g.connect(vol);
    a.addEventListener('error',()=>{if(L.alive)toast('Could not play '+id+'.');});
    L.parts.push({a,g,src});
  }
  const t=AC.currentTime,p0=L.parts[0];
  p0.g.gain.setValueAtTime(1,t);
  p0.a.play().catch(e=>{console.error('Study Grove audio:',e);if(L.alive)toast('Sound could not start. Click the page once and try again.');});
  out.gain.setTargetAtTime(1,t,.7);                                   // gentle fade-in
  L.iv=setInterval(()=>loopStep(L),150);
  return L;
}
function loopStep(L){
  if(!L.alive||L.xf)return;
  const cfg=SND_CFG[L.id],p=L.parts[L.cur],a=p.a,D=a.duration;
  if(!isFinite(D)||D<=0||a.paused&&!a.ended)return;
  const left=D-a.currentTime;
  const lead=cfg.ov||cfg.xf;
  if(left<=lead+.2||a.ended)loopCross(L,Math.max(.4,Math.min(lead,left)));
}
function loopCross(L,X){
  L.xf=true;
  const old=L.parts[L.cur],nw=L.parts[1-L.cur],t=AC.currentTime+.03;
  try{nw.a.currentTime=0;}catch(e){}
  nw.a.play().catch(()=>{});
  const cfg=SND_CFG[L.id];
  nw.g.gain.cancelScheduledValues(t);
  if(cfg.ov){                                  // natural overlap: the old pass keeps playing out its own fade
    if(cfg.fin){nw.g.gain.setValueAtTime(0,t);nw.g.gain.setValueCurveAtTime(XF_IN,t,cfg.fin);}else nw.g.gain.setValueAtTime(1,t);
  }else{
    old.g.gain.cancelScheduledValues(t);old.g.gain.setValueAtTime(1,t);old.g.gain.setValueCurveAtTime(XF_OUT,t,X);
    nw.g.gain.setValueAtTime(0,t);nw.g.gain.setValueCurveAtTime(XF_IN,t,X);
  }
  L.to=setTimeout(()=>{
    if(!L.alive)return;
    old.a.pause();try{old.a.currentTime=0;}catch(e){}
    old.g.gain.cancelScheduledValues(0);old.g.gain.value=0;
    L.cur=1-L.cur;L.xf=false;
  },X*1000+120);
}
async function ambStart(id){
  if(AMB[id]||PENDING.has(id)||!SND_CFG[id])return;
  if(!ensureAudio())return;
  PENDING.add(id);renderAmb();
  try{
    const url=await soundUrl(id);
    if(!PENDING.has(id))return;                       // switched off while it was loading
    PENDING.delete(id);AMB[id]=makeLoop(id,url);
  }catch(e){
    PENDING.delete(id);if(!(e&&e.missing))console.error('Study Grove audio:',e);
    if(e&&e.missing)WANT.add(id);
    if(e&&e.missing)haveSounds().then(h=>askSoundFiles(Object.keys(SND_NAMES).filter(k=>!h[k])));
    else toast('Could not load that sound.');
  }
  persistAmb();
}
function ambStop(id,fast){
  PENDING.delete(id);
  const L=AMB[id];if(!L)return;
  delete AMB[id];L.alive=false;clearInterval(L.iv);clearTimeout(L.to);
  const t=AC.currentTime;L.out.gain.cancelScheduledValues(t);L.out.gain.setTargetAtTime(0,t,fast?.008:.3);
  setTimeout(()=>{
    L.parts.forEach(({a,g,src})=>{try{a.pause();a.removeAttribute('src');a.load();}catch(e){}try{src.disconnect();g.disconnect();}catch(e){}});
    try{L.vol.disconnect();L.out.disconnect();}catch(e){}
  },fast?200:2000);
}
function persistAmb(){state.amb.on=[...Object.keys(AMB),...PENDING];save();renderAmb();}
function ambToggle(id){if(AMB[id]||PENDING.has(id))ambStop(id);else ambStart(id);persistAmb();}
function ambStopAll(){[...Object.keys(AMB),...PENDING].forEach(id=>ambStop(id,true));plStop();persistAmb();}
function setVol(v){state.amb.vol=clamp(v,0,1);if(ambBus)ambBus.gain.setTargetAtTime(state.amb.vol,AC.currentTime,.03);save();}
function setSoundVol(id,v){state.amb.vols[id]=clamp(v,0,1);const L=AMB[id];if(L)L.vol.gain.setTargetAtTime(SND_CFG[id].trim*state.amb.vols[id],AC.currentTime,.03);save();}
function setMute(m){state.amb.mute=m;if(master)master.gain.setTargetAtTime(m?0:1,AC.currentTime,.03);save();renderAmb();}

/* ---- your own music & sounds: stored in IndexedDB, played once through, never looped ---- */
const PL={tracks:[],cur:-1,el:null,gain:null,db:null,url:'',ok:true,order:0,ready:null};
const AUDIO_EXT=/\.(mp3|wav|ogg|oga|opus|m4a|aac|flac|weba|webm|mp4)$/i;
function mediaDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('IndexedDB is not available'));return;}
    const r=indexedDB.open('studygrove-media',2);
    r.onupgradeneeded=()=>{['tracks','sounds'].forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'});});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('could not open the music library'));
  });
}
const dbReq=(store,mode,fn)=>new Promise((res,rej)=>{
  const tx=PL.db.transaction(store,mode),st=tx.objectStore(store),rq=fn(st);
  tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
});
async function plLoad(){
  try{
    PL.db=await mediaDB();
    const all=await dbReq('tracks','readonly',st=>st.getAll());
    PL.tracks=(all||[]).filter(t=>t&&t.id&&t.blob).sort((a,b)=>(a.order||0)-(b.order||0));
    PL.order=PL.tracks.reduce((m,t)=>Math.max(m,t.order||0),0);
  }catch(e){PL.ok=false;console.error('Study Grove music library:',e);toast('Your music library could not be opened. Imports will not be saved.');}
  renderPlaylist();
}
function probeDuration(blob){
  return new Promise(res=>{
    const u=URL.createObjectURL(blob),a=new Audio();let done=false;
    const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(u);res(v);};
    a.preload='metadata';a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0);a.onerror=()=>fin(-1);
    setTimeout(()=>fin(0),6000);a.src=u;
  });
}
async function plAdd(files){
  let added=0,bad=[];
  for(const f of files){
    if(!(f.type&&f.type.startsWith('audio/'))&&!AUDIO_EXT.test(f.name)){bad.push(f.name);continue;}
    const dur=await probeDuration(f);
    if(dur<0){bad.push(f.name);continue;}
    const rec={id:uid(),name:f.name.replace(/\.[^.]+$/,''),fileName:f.name,type:f.type||'audio/mpeg',size:f.size,dur,order:++PL.order,added:Date.now(),blob:f};
    try{if(PL.db)await dbReq('tracks','readwrite',st=>st.put(rec));else throw new Error('library unavailable');}
    catch(e){console.error('Study Grove music library:',e);toast('"'+f.name+'" could not be saved for next time, so it will only last until you close the app.');}
    PL.tracks.push(rec);added++;renderPlaylist();
  }
  if(bad.length)toast((bad.length===1?'"'+bad[0]+'" is':bad.length+' files are')+' not an audio file the browser can play.');
  else if(added)toast(added+(added===1?' track':' tracks')+' added');
}
async function plRemove(id){
  const i=PL.tracks.findIndex(t=>t.id===id);if(i<0)return;
  if(i===PL.cur)plStop(true);else if(i<PL.cur)PL.cur--;
  PL.tracks.splice(i,1);
  try{if(PL.db)await dbReq('tracks','readwrite',st=>st.delete(id));}catch(e){console.error('Study Grove music library:',e);toast('Could not remove the track from storage.');}
  renderPlaylist();
}
function plEnsure(){
  if(PL.el)return true;
  if(!ensureAudio())return false;
  const a=new Audio();a.preload='auto';
  PL.el=a;PL.gain=AC.createGain();PL.gain.gain.value=1;
  AC.createMediaElementSource(a).connect(PL.gain);PL.gain.connect(ambBus);
  a.addEventListener('ended',()=>plNext(true));
  a.addEventListener('play',renderPlaylist);a.addEventListener('pause',renderPlaylist);
  a.addEventListener('timeupdate',plTime);a.addEventListener('loadedmetadata',plTime);
  a.addEventListener('error',()=>{toast('That track could not be played.');plNext(true);});
  return true;
}
function plPlay(i){
  const t=PL.tracks[i];if(!t||!plEnsure())return;
  if(i===PL.cur&&PL.el.src){PL.el.play().catch(()=>{});return;}      // resume the paused track
  if(PL.url)URL.revokeObjectURL(PL.url);
  PL.url=URL.createObjectURL(t.blob);PL.cur=i;PL.el.src=PL.url;
  PL.gain.gain.cancelScheduledValues(0);PL.gain.gain.value=0;PL.gain.gain.setTargetAtTime(1,AC.currentTime,.12);
  PL.el.play().catch(e=>{console.error('Study Grove audio:',e);toast('The track could not start. Click the page once and try again.');});
  renderPlaylist();
}
function plPause(){if(PL.el&&!PL.el.paused)PL.el.pause();}
function plToggle(){
  if(PL.cur<0){if(PL.tracks.length)plPlay(0);return;}
  if(PL.el&&!PL.el.paused)plPause();else if(PL.el&&PL.el.ended)plPlay(PL.cur);else plPlay(PL.cur);

function streakDays(){
  const MIN=5*60;let n=0;const d=parseKey(studyDay());
  if(daySec(dateKey(d))<MIN)d.setDate(d.getDate()-1);
  while(daySec(dateKey(d))>=MIN&&n<3650){n++;d.setDate(d.getDate()-1);}
  return n;
}
function weekSeconds(){          // the current week, Saturday (at the reset time) to today
  let n=0;const t=studyDay(),d=parseKey(weekStartKey(t));
  for(let i=0;i<7&&dateKey(d)<=t;i++){n+=daySec(dateKey(d));d.setDate(d.getDate()+1);}
  return n;
}

}

const fmt12=m=>{const h=Math.floor(m/60),mm=m%60;return((h%12)||12)+':'+pad(mm)+' '+(h>=12?'PM':'AM');};
const hhmm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function syncReset(){
  const inp=$('#setReset',el.setBody),note=$('#resetNote',el.setBody);if(!inp)return;
  const st=S(),p=st.resetPending;
  if(document.activeElement!==inp)inp.value=hhmm(p?p.min:st.resetMin);
  note.textContent=p?'Your day starts at '+fmt12(st.resetMin)+' now. '+fmt12(p.min)+' begins tomorrow.':'Your study day starts at '+fmt12(st.resetMin)+'.';
}
function setResetTime(v){
  const m=/^(\d{1,2}):(\d{2})/.exec(v||'');if(!m){syncReset();return;}
  const min=clamp(+m[1]*60+ +m[2],0,1439),st=S();
  if(min===st.resetMin){st.resetPending=null;}
  else{   // takes effect when the next study day begins
    const today=parseKey(studyDay()),next=new Date(today.getFullYear(),today.getMonth(),today.getDate()+1,0,st.resetMin);
    st.resetPending={min,fromMs:next.getTime(),from:dateKey(new Date(today.getFullYear(),today.getMonth(),today.getDate()+1))};
  }
  save();syncReset();updateAll();refreshCal();
  toast(st.resetPending?'Reset time will change to '+fmt12(min)+' from tomorrow.':'Daily reset time stays at '+fmt12(st.resetMin)+'.');
}
const getNum=k=>k==='goalH'?Math.floor(S().goal/60):k==='goalM'?S().goal%60:S()[k];

function setNum(k,v){
  if(v===''||v===null)return;
  v=Math.round(+v);if(!Number.isFinite(v))return;
  if(k==='goalH'||k==='goalM'){
    let h=Math.floor(S().goal/60),m=S().goal%60;
    if(k==='goalH')h=clamp(v,0,24);else m=clamp(v,0,59);
    S().goal=clamp(h*60+m,LIM.goal[0],LIM.goal[1]);     // 0h 0m would make a goal of nothing, so the smallest goal is 1 minute
    save();updateAll();refreshCal();return;
  }
  S()[k]=clamp(v,LIM[k][0],LIM[k][1]);
  if(k==='focus'||k==='short'||k==='long')applyDurations();
  save();updateAll();
}

const rep={tab:'week',off:0,scope:'week',html:''};
const SHORT_D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],SHORT_M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function weekData(off){
  const today=studyDay(),st=parseKey(weekStartKey(today));st.setDate(st.getDate()+off*7);
  const days=[];let total=0,elapsed=0,met=0;
  for(let i=0;i<7;i++){
    const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),k=dateKey(d),fut=k>today;
    const sec=fut?0:daySec(k);total+=sec;if(!fut){elapsed++;if(sec>=goalSec())met++;}
    days.push({k,d,sec,fut,today:k===today});
  }
  return{days,total,elapsed,met,start:days[0].d,end:days[6].d};
}
const rangeTxt=w=>w.start.getDate()+' '+SHORT_M[w.start.getMonth()]+' – '+w.end.getDate()+' '+SHORT_M[w.end.getMonth()]+' '+w.end.getFullYear();
function repNav(w,showToday){
  return '<div class="rep-nav"><button type="button" class="icon-btn" data-rw="-1" aria-label="Previous week"><svg class="i"><use href="#i-left"/></svg></button><b>'+rangeTxt(w)+(rep.off===0?' · This week':'')+'</b>'+
    '<button type="button" class="icon-btn" data-rw="1" aria-label="Next week"'+(rep.off>=0?' disabled':'')+'><svg class="i"><use href="#i-right"/></svg></button>'+
    (rep.off!==0?'<button type="button" class="btn" data-rw="0">This week</button>':'')+'</div>';
}
function weekHTML(){
  const w=weekData(rep.off),prev=weekData(rep.off-1),goal=goalSec();
  const avg=w.elapsed?w.total/w.elapsed:0,wk=goal*7,wp=clamp(fin(w.total/wk),0,1);
  const mx=Math.max(goal,...w.days.map(d=>d.sec))*1.06||1;
  let h=repNav(w);
  h+='<div class="rep-kpis"><div class="card"><small>Total studied</small><b>'+fmtDur(w.total)+'</b><em>'+(w.total/3600).toFixed(1)+' hours</em></div>'+
     '<div class="card"><small>Daily average</small><b>'+fmtDur(avg)+'</b><em>over '+w.elapsed+(w.elapsed===1?' day':' days')+'</em></div>'+
     '<div class="card"><small>Goal reached</small><b>'+w.met+' / '+w.elapsed+'</b><em>'+(w.elapsed===1?'day':'days')+' at '+fmtDur(goal)+'+</em></div></div>';
  h+='<div class="rep-sec">Daily breakdown</div><div class="rep-chart">'+w.days.map(d=>{
    const hp=d.sec>0?Math.max(1.5,d.sec/mx*100):0,met=!d.fut&&d.sec>=goal;
    return '<div class="rc'+(d.today?' today':'')+(met?' met':'')+(d.fut?' fut':'')+'" title="'+SHORT_D[d.d.getDay()]+' '+d.d.getDate()+' '+SHORT_M[d.d.getMonth()]+' · '+fmtDur(d.sec)+'">'+
      '<div class="rc-v">'+(d.fut?'':d.sec>0?fmtDur(d.sec):'–')+'</div><div class="rc-w"><div class="rc-goal" style="bottom:'+(goal/mx*100).toFixed(2)+'%"></div><div class="rc-bar" style="height:'+hp.toFixed(2)+'%"></div></div>'+
      '<div class="rc-l">'+SHORT_D[d.d.getDay()]+'<small>'+d.d.getDate()+'</small></div></div>';}).join('')+'</div>'+
    '<div class="rep-key"><span><i></i>Daily goal ('+fmtDur(goal)+')</span><span>Gold bar = goal reached</span></div>';
  h+='<div class="rep-sec">Goal completion</div><div class="rep-bar"><i style="width:'+(wp*100).toFixed(1)+'%"></i></div>'+
     '<div class="rep-line"><span>'+fmtDur(w.total)+' of '+fmtDur(wk)+' weekly goal</span><b>'+Math.round(wp*100)+'%</b></div>';
  // compare with the previous week; a week still in progress is compared over the same number of days
  const same=prev.days.slice(0,w.elapsed).reduce((a,d)=>a+d.sec,0),base=rep.off===0&&w.elapsed<7?same:prev.total;
  const diff=w.total-base,pc=base>0?Math.round(diff/base*100):null,mxw=Math.max(w.total,prev.total,1);
  h+='<div class="rep-sec">Compared with the previous week</div>'+
     '<div class="rep-line"><span>This week</span><b>'+fmtDur(w.total)+'</b></div><div class="rep-bar"><i style="width:'+(w.total/mxw*100).toFixed(1)+'%"></i></div>'+
     '<div class="rep-line"><span>Previous week</span><b>'+fmtDur(prev.total)+'</b></div><div class="rep-bar"><i style="width:'+(prev.total/mxw*100).toFixed(1)+'%;opacity:.55"></i></div>';
  const lbl=rep.off===0&&w.elapsed<7?'the same days last week':'the previous week';
  h+='<span class="rep-delta '+(diff>0?'up':diff<0?'down':'')+'">'+(base<=0&&w.total<=0?'No study in either week yet':base<=0?'Nothing to compare with '+lbl:
     diff===0?'Same as '+lbl:(diff>0?'▲ ':'▼ ')+fmtDur(Math.abs(diff))+(pc!==null?' ('+(diff>0?'+':'−')+Math.abs(pc)+'%)':'')+' vs '+lbl)+'</span>';
  return h;
}
function subjectHTML(){
  const wk=weekData(rep.off),a=dateKey(wk.start),b=dateKey(wk.end),by={};let tot=0;
  for(const s of state.sessions){
    if(!(s.s>0))continue;
    if(rep.scope==='week'){const k=studyDay(s.t);if(k<a||k>b)continue;}
    const nm=s.subject||'General study';by[nm]=(by[nm]||0)+s.s;tot+=s.s;
  }
  let live=0;      // the running, unsaved session counts too; pressing Reset discards it again
  if(isFocus()&&T.status!=='idle'){
    if(rep.scope==='all')live=pendingSeconds();
    else{const today=studyDay();for(const d of wk.days)if(d.k<=today)live+=liveDay(d.k);}
    if(live>0){const nm=T.subject||state.subject||'General study';by[nm]=(by[nm]||0)+live;tot+=live;}
  }
  const rows=Object.entries(by).sort((x,y)=>y[1]-x[1]);
  let h='<div class="rep-nav"><div class="tabs2" role="tablist"><button type="button" role="tab" data-scope="week" aria-selected="'+(rep.scope==='week')+'">Weekly</button><button type="button" role="tab" data-scope="all" aria-selected="'+(rep.scope==='all')+'">All-time</button></div>'+
    (rep.scope==='week'?'<button type="button" class="icon-btn" data-rw="-1" aria-label="Previous week"><svg class="i"><use href="#i-left"/></svg></button><b>'+rangeTxt(wk)+(rep.off===0?' · This week':'')+'</b><button type="button" class="icon-btn" data-rw="1" aria-label="Next week"'+(rep.off>=0?' disabled':'')+'><svg class="i"><use href="#i-right"/></svg></button>':'<b>All saved sessions</b>')+'</div>';
  if(!rows.length)return h+'<div class="rep-empty">No saved study sessions '+(rep.scope==='week'?'in this week':'yet')+'.<br>Press Save after studying and your subjects will appear here.</div>';
  const R=70,C=2*Math.PI*R;let acc=0;
  const segs=rows.map(([n,v])=>{const len=v/tot*C,o='<circle cx="100" cy="100" r="'+R+'" stroke="'+subjColor(n)+'" stroke-dasharray="'+Math.max(0,len-(rows.length>1?1.5:0)).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'"/>';acc+=len;return o;}).join('');
  h+='<div class="sub-wrap"><div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Study time by subject"><circle cx="100" cy="100" r="'+R+'" stroke="rgba(255,255,255,.07)"/>'+segs+'</svg><div class="dc"><b>'+fmtDur(tot)+'</b><small>'+(rep.scope==='week'?'this week':'all time')+'</small></div></div>'+
    '<ul class="sub-list">'+rows.map(([n,v])=>{const p=v/tot*100,c=subjColor(n);
      return '<li><span class="sd" style="background:'+c+'"></span><span>'+esc(n)+'</span><span class="st">'+fmtDur(v)+'</span><span class="sp">'+(p<1?'<1':Math.round(p))+'%</span><span class="sb"><i style="width:'+p.toFixed(1)+'%;background:'+c+'"></i></span></li>';}).join('')+'</ul></div>';
  if(live>0)h+='<div class="rep-key"><span>Includes your running, unsaved session</span></div>';
  return h;
}
